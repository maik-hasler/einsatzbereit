termsDetails=<p>Einsatzbereit vermittelt zwischen Freiwilligen und Einsätzen, die von unabhängigen Organisationen veröffentlicht werden - wir organisieren, beaufsichtigen oder begleiten diese Aktivitäten nicht selbst. Du verpflichtest dich, korrekte Angaben zu machen, andere Nutzerinnen und Nutzer sowie Organisationen respektvoll zu behandeln und den Anweisungen der veranstaltenden Organisation vor Ort zu folgen. Die Teilnahme an Einsätzen erfolgt auf eigenes Risiko; Organisationen sind verantwortlich für die von ihnen veröffentlichten Angebote.</p><p>Die E-Mail-Adresse und der Benutzername, die du oben eingibst, werden gespeichert, um dein Konto zu erstellen und abzusichern - was wir dabei erheben und warum, erfährst du in unserer <a href="https://einsatzbereit.maik-hasler.de/privacy-policy" target="_blank" rel="noopener noreferrer">Datenschutzerklärung</a>.</p><p>Den vollständigen Text beider Dokumente findest du jederzeit unter Rechtliches in der App.</p>
acceptTerms=Ich stimme den Nutzungsbedingungen zu
