termsText=<p>Before you can use Einsatzbereit, please confirm that you accept our Terms of Use.</p><p>Einsatzbereit is an intermediary that connects volunteers with opportunities published by independent organizations - we do not organize, supervise, or take part in those activities ourselves. You agree to provide accurate information, treat other users and organizations with respect, and follow the on-site instructions of the organization hosting an opportunity. Participation in volunteer opportunities is at your own risk; organizations are responsible for the listings they publish.</p><p>The name, email address, and password you enter above are stored to create and secure your account - see our <a href="https://einsatzbereit.maik-hasler.de/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy Policy</a> for what we collect and why.</p><p>The full text of both is available at any time under Legal in the app.</p>
