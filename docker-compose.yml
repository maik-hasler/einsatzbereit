# Traefik runs as a host-level container outside this stack (shared across
# multiple projects on the same host). Our services attach to the existing
# proxy network and register routes via labels - they expect a Traefik
# instance with the `myresolver` ACME resolver already configured.
#
# Every service below shares the same `logging: *default-logging` driver
# config (json-file, capped at 10m x 3 files) - without it, container stdout
# grows unbounded on the host disk (#1081).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    networks:
      - db
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/01-create-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 10s
      retries: 20

  keycloak:
    # IMAGE_TAG lets publish.yml's deploy-staging and deploy-production jobs
    # point the same compose file at different images on the same host
    # without editing this file per deploy (#1344). Both jobs render this to
    # the specific version tag being released (not a floating "staging"/
    # "latest" tag) so a bad deploy has an immutable prior version to roll
    # back to (#1733) - the "staging" fallback here only applies if IMAGE_TAG
    # is unset entirely, e.g. a manual `docker compose up` on a fresh host.
    image: ghcr.io/maik-hasler/einsatzbereit-keycloak:${IMAGE_TAG:-staging}
    container_name: keycloak
    restart: unless-stopped
    networks:
      - proxy
      - db
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.00"
    depends_on:
      postgres:
        condition: service_healthy
    # The Keycloak image ships no curl/wget, so probe the management health
    # endpoint (port 9000) over bash's /dev/tcp instead. /bin/sh is bash on the
    # UBI-based image, but we invoke bash explicitly for clarity and parity with
    # the backend (whose /bin/sh is dash and cannot do /dev/tcp).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/9000 && printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && cat <&3 | grep -q "200 OK"'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KC_HOSTNAME: https://login.maik-hasler.de
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Without this, Keycloak 26 ignores X-Forwarded-For and attributes every
      # request to the Traefik container's internal IP, so login/admin-event
      # records and any IP-based brute-force policy are useless (#1187).
      # Safe only because Traefik is the sole ingress on the `proxy` network -
      # nothing else can reach Keycloak to spoof the header end-to-end.
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Deliberately keeps the einsatzbereit realm's baked-in vera/olaf/admin demo
      # accounts (and their public, documented passwords) alive across restarts -
      # staging is disposable demo/QA infrastructure, not production, and these
      # accounts are meant to be publicly known and instantly restorable rather
      # than rotated or hardened. See keycloak/AGENTS.md and #1166.
      KC_SPI_REALM_IMPORTER_FILE_IMPORT_BEHAVIOR: OVERWRITE_EXISTING
      # Resolves the "${KEYCLOAK_BACKEND_SECRET}" placeholder in the imported
      # realm JSON (keycloak/realms/einsatzbereit-realm.json) into the backend
      # client's actual secret. Must match the backend service's own
      # Keycloak__ClientSecret below.
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET:?set KEYCLOAK_BACKEND_SECRET in .env}
      # Resolves the realm's smtpServer "${KC_SMTP_*}" placeholders so
      # verifyEmail/resetPasswordAllowed can actually deliver mail (#1070,
      # #1342). Same mailbox credentials as the backend's Smtp__* below.
      KC_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      KC_SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in .env}
      KC_SMTP_FROM: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env}
      KC_SMTP_USER: ${SMTP_USERNAME:?set SMTP_USERNAME in .env}
      KC_SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.keycloak.rule=Host(`login.maik-hasler.de`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.certresolver=myresolver
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  db-backup:
    image: prodrigestivill/postgres-backup-local:18
    container_name: db-backup
    restart: unless-stopped
    networks:
      - db
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: einsatzbereit,keycloak
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - postgres_backups:/backups

  minio:
    # Pinned instead of :latest - an unreviewed upstream MinIO release landing
    # on every `docker compose pull` during a deploy is exactly the kind of
    # unattended-breaking-change risk pinning exists to prevent. Renovate
    # tracks new RELEASE.* tags the same way it tracks everything else here.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks:
      - proxy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.minio.rule=Host(`storage.maik-hasler.de`)
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls=true
      - traefik.http.routers.minio.tls.certresolver=myresolver
      - traefik.http.services.minio.loadbalancer.server.port=9000

  # One-shot bootstrap (#1353): creates the "einsatzbereit" bucket if it
  # doesn't exist yet and a bucket-scoped service account for the backend to
  # authenticate with instead of MinIO's own root credentials - a leaked
  # backend secret can then only read/write inside this one bucket, not
  # administer the whole MinIO instance (create/delete other buckets, manage
  # other users). Re-runs harmlessly on every deploy (docker compose up -d
  # restarts a previously-exited one-shot container the same as any other) -
  # every step below is idempotent or explicitly tolerant of already existing.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - proxy
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET_NAME: einsatzbereit
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set MINIO_APP_ACCESS_KEY in .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in .env}
    configs:
      - source: minio-init-script
        target: /init.sh

  # Daily snapshot of the "einsatzbereit" bucket (avatars/logos/banners) into
  # its own volume, mirroring db-backup's role for Postgres (#1087 - MinIO
  # previously had no backup at all). Also mirrors both local backup volumes
  # (this one's own output plus db-backup's postgres_backups) to a Hetzner
  # Object Storage bucket on the same cadence - closes the off-host gap #1087
  # originally left open, without a third backup container: this image
  # already speaks S3 for the local mirror, so the offsite leg is one more
  # `mc alias` and two more `mc mirror` calls in the same script.
  minio-backup:
    # Pinned for the same reason as minio's own image above.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks:
      - proxy
    logging: *default-logging
    # Higher than a single-purpose mirror needs - this process handles both
    # the local mirror and the offsite replication of two datasets.
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.20"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET_NAME: einsatzbereit
      # Mirrors db-backup's BACKUP_KEEP_DAYS (see above) - no weekly/monthly
      # tiers here, unlike db-backup, since a daily full mirror of MinIO's
      # (much smaller, less write-heavy) bucket is cheap enough that one flat
      # retention window is proportionate rather than under-engineered.
      BACKUP_KEEP_DAYS: "7"
      BACKUP_INTERVAL_SECONDS: "86400"
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:?set OFFSITE_S3_ENDPOINT in .env}
      OFFSITE_S3_ACCESS_KEY: ${OFFSITE_S3_ACCESS_KEY:?set OFFSITE_S3_ACCESS_KEY in .env}
      OFFSITE_S3_SECRET_KEY: ${OFFSITE_S3_SECRET_KEY:?set OFFSITE_S3_SECRET_KEY in .env}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-einsatzbereit-backups}
    volumes:
      - minio_backups:/backups
      - postgres_backups:/backup-sources/postgres:ro
    configs:
      - source: minio-backup-script
        target: /backup.sh

  backend:
    image: ghcr.io/maik-hasler/einsatzbereit-backend:${IMAGE_TAG:-staging}
    # No container_name (#1392): a fixed name forbids `docker compose up --scale
    # backend=N`, since Compose can't give a second replica the same name. Traefik's
    # Docker provider merges multiple containers sharing the same
    # traefik.http.routers.backend.* labels into one load-balanced service
    # automatically, and the prometheus-config target below resolves every replica via
    # DNS instead of a single fixed hostname, so no other change is needed here to make
    # scaling itself work.
    #
    # Not yet done: OutboxProcessorJob/EngagementReminderJob are now safe to run
    # multiplied (#1392 fixed their claim races), but the Database__MigrateOnStartup
    # env var below is not - two replicas booting together would both attempt to apply
    # pending EF Core migrations concurrently with no lock between them. Actually
    # running `--scale backend=2` on staging needs that solved first (e.g. a
    # migration-only leader step, or a Postgres advisory lock around
    # Database.MigrateAsync()); this change only removes the blocker that made scaling
    # impossible to even attempt.
    restart: unless-stopped
    # Compose's default stop_grace_period (10s) is shorter than .NET's own
    # shutdown timeout (30s), so `docker compose down`/`up --remove-orphans`
    # on every deploy could SIGKILL the backend mid-shutdown before
    # OutboxProcessorJob/EngagementReminderJob finish their current
    # iteration. Match .NET's timeout instead of cutting it short.
    stop_grace_period: 30s
    networks:
      - proxy
      - db
      - monitoring
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # curl is installed in the Dockerfile (as root before switching to $APP_UID).
    # /alive (not /health) is used so the container is gated on the app being up,
    # not on downstream readiness, which avoids dependency deadlocks.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/alive"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Staging}
      Database__MigrateOnStartup: "true"
      # Defaults to false so a fresh non-staging deployment of this compose
      # file doesn't come up populated with the fictional "Lindenauer" demo
      # organizations/opportunities from ApplicationDbContextInitializer.
      # The staging deploy job (publish.yml) explicitly overrides this to
      # "true" in the rendered .env - staging is meant to come back seeded
      # (#1375).
      Database__SeedOnStartup: ${DATABASE_SEED_ON_STARTUP:-false}
      ConnectionStrings__einsatzbereit: "Host=postgres;Database=einsatzbereit;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Authentication__Authority: https://login.maik-hasler.de/realms/einsatzbereit
      Authentication__ValidIssuers__0: https://login.maik-hasler.de/realms/einsatzbereit
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__ClientSecret: ${KEYCLOAK_BACKEND_SECRET:?set KEYCLOAK_BACKEND_SECRET in .env}
      Cors__Origins__0: https://einsatzbereit.maik-hasler.de
      # Backend's own public origin (#1055) - embedded in one-click unsubscribe
      # links sent in transactional emails, which must resolve from outside the
      # docker network. Distinct from Cors__Origins__0 above, which is the
      # frontend's origin.
      Api__PublicBaseUrl: https://api.maik-hasler.de
      Storage__Endpoint: http://minio:9000
      # Bucket-scoped app credentials (minio-init, #1353), not MinIO's root
      # user - a leaked value here can only touch this one bucket, not
      # administer the whole MinIO instance.
      Storage__AccessKey: ${MINIO_APP_ACCESS_KEY:?set MINIO_APP_ACCESS_KEY in .env}
      Storage__SecretKey: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in .env}
      Storage__BucketName: einsatzbereit
      Storage__PublicEndpoint: https://storage.maik-hasler.de
      # Same mailbox as the keycloak service's KC_SMTP_* above (#1341).
      Smtp__Host: ${SMTP_HOST:?set SMTP_HOST in .env}
      Smtp__Port: ${SMTP_PORT:?set SMTP_PORT in .env}
      Smtp__Username: ${SMTP_USERNAME:?set SMTP_USERNAME in .env}
      Smtp__Password: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env}
      Smtp__FromName: ${SMTP_FROM_NAME:?set SMTP_FROM_NAME in .env}
      Smtp__EnableSsl: "true"
      # Second Kestrel listener, scraped by prometheus over the "monitoring"
      # network above. Deliberately not a value from .env/secrets - it isn't
      # sensitive, and the safety property that matters (not publicly
      # reachable) comes from Traefik's backend router below only ever
      # pointing at port 8080, never 8081 (#1341).
      Metrics__Port: "8081"
      # Read by ServiceDefaults/Extensions.cs's AddOpenTelemetryExporters -
      # enables the OTLP trace exporter, which is otherwise a no-op. Plain
      # http (no TLS) is fine: this traffic never leaves the internal
      # "monitoring" network above. gRPC is the exporter's default protocol,
      # so no separate OTEL_EXPORTER_OTLP_PROTOCOL is needed for tempo's
      # matching gRPC receiver on 4317 (#1352).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.backend.rule=Host(`api.maik-hasler.de`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=myresolver
      - traefik.http.services.backend.loadbalancer.server.port=8080

  frontend:
    image: ghcr.io/maik-hasler/einsatzbereit-frontend:${IMAGE_TAG:-staging}
    container_name: frontend
    restart: unless-stopped
    networks:
      - proxy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.10"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      VITE_KEYCLOAK_AUTHORITY_URL: https://login.maik-hasler.de/realms/einsatzbereit
      VITE_KEYCLOAK_CLIENT_ID: frontend
      VITE_API_URL: https://api.maik-hasler.de
      STORAGE_PUBLIC_URL: https://storage.maik-hasler.de
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.frontend.rule=Host(`einsatzbereit.maik-hasler.de`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=myresolver
      - traefik.http.services.frontend.loadbalancer.server.port=80

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    volumes:
      - prometheus_data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus-rules
        target: /etc/prometheus/alert.rules.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Routes firing alerts (prometheus-config's `alerting:` block + the rules in
  # prometheus-rules below) to email over the same SMTP relay the backend and
  # Keycloak already use (#1341) - no new third-party notification channel,
  # consistent with this stack's self-hosted-over-SaaS precedent (ADR-6, #1081).
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    volumes:
      - alertmanager_data:/alertmanager
    configs:
      - source: alertmanager-config
        target: /etc/alertmanager/alertmanager.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Host-level metrics only (CPU/memory/disk/network), read-only mounts, no
  # privileged mode. Deliberately not pairing this with cAdvisor for
  # per-container metrics - cAdvisor needs the Docker socket and broad host
  # access, which is too invasive for a box shared with other projects.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - proxy
      - monitoring
    logging: *default-logging
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: https://grafana.maik-hasler.de
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/prometheus.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.grafana.rule=Host(`grafana.maik-hasler.de`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=myresolver
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    volumes:
      - loki_data:/loki
    # No Docker healthcheck: confirmed on staging that grafana/loki has
    # neither wget nor a shell, so CMD-SHELL and exec-form CMD wget both
    # fail regardless of whether Loki itself is fine - `docker ps` showed
    # "unhealthy" even while Loki's own logs proved it was serving queries
    # successfully. Nothing depends on this healthcheck (see alloy's
    # depends_on below), so leaving it out is honest instead of misleading.

  # Ships container logs to Loki. Uses the Docker API (read-only socket mount)
  # to discover containers and stream their logs, rather than tailing
  # /var/lib/docker/containers directly - this is the standard, well-tested
  # pattern Grafana documents for Alloy/Promtail + Docker. This is a narrower
  # grant than cAdvisor's (list containers + read their logs, not full host
  # filesystem + cgroup access), but a leaked docker.sock is still
  # effectively host-level access - worth knowing, not a reason to avoid it
  # for a single-purpose, Grafana-maintained log shipper.
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    # Plain depends_on (wait for container start, not health): Alloy's Loki
    # writer retries and buffers on its own, so it doesn't need Loki to be
    # fully ready first. Deliberately not `condition: service_healthy` -
    # observability's own startup issues should never be able to block or
    # roll back the application deploy the way this one did.
    depends_on:
      - loki
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    configs:
      - source: alloy-config
        target: /etc/alloy/config.alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

  # Trace store. Receives OTLP push directly from the backend (see backend's
  # OTEL_EXPORTER_OTLP_ENDPOINT above) rather than being discovered/scraped -
  # unlike Loki, there is no separate shipper here since the backend already
  # speaks OTLP natively via ServiceDefaults. Single-binary mode (no separate
  # ingester/querier/compactor processes), mirrors Loki's monolithic setup
  # above - proportionate to this stack's own trace volume.
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    volumes:
      - tempo_data:/var/tempo
    configs:
      - source: tempo-config
        target: /etc/tempo/tempo.yaml
    command:
      - -config.file=/etc/tempo/tempo.yaml
    # No Docker healthcheck: unlike Loki (confirmed lacking wget/shell on
    # staging, see loki's comment above), this hasn't been verified either
    # way for the Tempo image - left out rather than guessed at. Nothing
    # depends on this container via `condition: service_healthy`, so a
    # missing healthcheck doesn't block or gate anything else.

networks:
  proxy:
    name: proxy
    external: true
  db:
    name: einsatzbereit-db
  monitoring:
    name: einsatzbereit-monitoring

volumes:
  postgres_data:
  postgres_backups:
  minio_data:
  minio_backups:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:

configs:
  postgres-init:
    content: |
      SELECT 'CREATE DATABASE einsatzbereit' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'einsatzbereit')\gexec
      SELECT 'CREATE DATABASE keycloak' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec
  # Bootstraps the bucket-scoped app service account (#1353) - see the
  # minio-init service above. Idempotent: safe to re-run on every deploy.
  # Same `$$` escaping convention as minio-backup-script below.
  minio-init-script:
    content: |
      #!/bin/sh
      set -eu

      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null

      mc mb --ignore-existing "local/$${MINIO_BUCKET_NAME}"

      cat > /tmp/app-policy.json <<POLICY
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:*"],
            "Resource": [
              "arn:aws:s3:::$${MINIO_BUCKET_NAME}",
              "arn:aws:s3:::$${MINIO_BUCKET_NAME}/*"
            ]
          }
        ]
      }
      POLICY

      mc admin policy create local einsatzbereit-app /tmp/app-policy.json

      mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" 2>/dev/null || true

      mc admin policy attach local einsatzbereit-app --user "$$MINIO_APP_ACCESS_KEY" 2>/dev/null || true

      echo "MinIO app service account ready (bucket: $${MINIO_BUCKET_NAME})."
  # Backs up the einsatzbereit bucket to /backups/<YYYY-MM-DD>, once per
  # BACKUP_INTERVAL_SECONDS, pruning down to BACKUP_KEEP_DAYS snapshots after
  # each run. `find` is not available in the minio/mc image (RHEL9-UBI-based,
  # no findutils) - the directory listing/pruning below deliberately uses
  # only shell globbing plus sort/wc/head/rm, all confirmed present in that
  # image, instead.
  # Every `$` below is doubled (`$$`) - compose interpolates `${...}`/`$VAR`
  # in config content the same as anywhere else in this file, so a single `$`
  # here would be silently resolved (usually to blank, since these are
  # script-local shell variables Compose has never heard of) before the
  # script ever reaches the container. `$$` escapes to a literal `$`, which
  # is what the container's own /bin/sh needs to see.
  minio-backup-script:
    content: |
      #!/bin/sh
      set -eu

      BUCKET="$${MINIO_BUCKET_NAME:-einsatzbereit}"
      KEEP_DAYS="$${BACKUP_KEEP_DAYS:-7}"
      INTERVAL="$${BACKUP_INTERVAL_SECONDS:-86400}"
      OFFSITE_BUCKET="$${OFFSITE_S3_BUCKET:-einsatzbereit-backups}"

      mc alias set source http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
      mc alias set offsite "$$OFFSITE_S3_ENDPOINT" "$$OFFSITE_S3_ACCESS_KEY" "$$OFFSITE_S3_SECRET_KEY" >/dev/null

      backup_once() {
        stamp="$$(date +%Y-%m-%d)"
        dest="/backups/$${stamp}"
        echo "$$(date -Iseconds) backing up source/$${BUCKET} to $${dest}"
        mc mirror --overwrite --quiet "source/$${BUCKET}" "$${dest}"
      }

      prune_old() {
        list_file=/tmp/.backup-dirs
        : > "$$list_file"
        for d in /backups/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]; do
          [ -d "$$d" ] && echo "$$d" >> "$$list_file"
        done
        sort -o "$$list_file" "$$list_file"
        total=$$(wc -l < "$$list_file")
        excess=$$((total - KEEP_DAYS))
        if [ "$$excess" -gt 0 ]; then
          head -n "$$excess" "$$list_file" | while read -r old; do
            echo "$$(date -Iseconds) pruning $${old}"
            rm -rf "$${old}"
          done
        fi
      }

      # --remove propagates deletions too, not just new/changed files - both
      # sources above already get pruned to their own retention window, and
      # without --remove the offsite bucket would never shed what they've
      # pruned, growing unbounded instead of mirroring the same retention.
      offsite_sync() {
        echo "$$(date -Iseconds) mirroring local backups to offsite/$${OFFSITE_BUCKET}"
        mc mirror --overwrite --remove --quiet /backups "offsite/$${OFFSITE_BUCKET}/minio"
        mc mirror --overwrite --remove --quiet /backup-sources/postgres "offsite/$${OFFSITE_BUCKET}/postgres"
      }

      while true; do
        backup_once
        prune_old
        offsite_sync
        sleep "$$INTERVAL"
      done
  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      alerting:
        alertmanagers:
          - static_configs:
              - targets: ["alertmanager:9093"]

      rule_files:
        - /etc/prometheus/alert.rules.yml

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: node-exporter
          static_configs:
            - targets: ["node-exporter:9100"]

        # Port 8081, not the Traefik-routed 8080 - see backend's Metrics__Port
        # and networks above (#1341). dns_sd_configs (not static_configs) so a
        # scaled `docker compose up --scale backend=N` gets every replica scraped:
        # Docker's embedded DNS returns one A record per replica for the plain
        # service name "backend" on a shared network, and Prometheus's DNS-SD
        # re-resolves that on every refresh_interval instead of caching a single
        # IP the way static_configs would (#1392).
        - job_name: backend
          dns_sd_configs:
            - names: ["backend"]
              type: A
              port: 8081
              refresh_interval: 30s
  # Kept to a single, well-established signal (staleness) rather than guessing
  # at application metric names/thresholds that haven't been validated against
  # real staging traffic - see #1081. Fires whenever any scrape target
  # (prometheus/node-exporter/backend) stops responding.
  #
  # "$$labels" (not "$labels"): this whole block is compose-interpolated
  # before Prometheus ever sees it, so a literal "$" for Prometheus's own Go
  # template syntax must be escaped the same way node-exporter's regex above
  # escapes its own literal "$".
  prometheus-rules:
    content: |
      groups:
        - name: staging-availability
          rules:
            - alert: InstanceDown
              expr: up == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "{{ $$labels.job }} instance {{ $$labels.instance }} is down"
                description: "Prometheus has not been able to scrape {{ $$labels.job }} ({{ $$labels.instance }}) for more than 2 minutes."
  alertmanager-config:
    content: |
      global:
        smtp_smarthost: '${SMTP_HOST:?set SMTP_HOST in .env}:${SMTP_PORT:?set SMTP_PORT in .env}'
        smtp_from: '${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env}'
        smtp_auth_username: '${SMTP_USERNAME:?set SMTP_USERNAME in .env}'
        smtp_auth_password: '${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}'
        smtp_require_tls: true

      route:
        receiver: default
        group_by: ['alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

      receivers:
        - name: default
          email_configs:
            - to: '${ALERT_NOTIFICATION_EMAIL:?set ALERT_NOTIFICATION_EMAIL in .env}'
              send_resolved: true
  grafana-datasources:
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          editable: false
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          editable: false
        - name: Alertmanager
          type: alertmanager
          access: proxy
          url: http://alertmanager:9093
          editable: false
          jsonData:
            implementation: prometheus
  alloy-config:
    content: |
      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      discovery.relabel "containers" {
        targets = discovery.docker.containers.targets

        # This host runs other projects behind the same shared Traefik
        # (see this file's top comment) - without this filter Alloy
        # discovers every container on the box, not just this stack's,
        # and tries to ship their logs too. Besides leaking unrelated
        # projects' log data into this stack's Loki, a long-running
        # container discovered for the first time gets its full log
        # backlog tailed, which Loki correctly rejects as "too old" and
        # drops the whole batch over - taking this stack's own log lines
        # down with it.
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_project"]
          regex         = "einsatzbereit"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
      }

      loki.source.docker "default" {
        host          = "unix:///var/run/docker.sock"
        targets       = discovery.docker.containers.targets
        labels        = {"job" = "docker"}
        relabel_rules = discovery.relabel.containers.rules
        forward_to    = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }
  tempo-config:
    content: |
      server:
        http_listen_port: 3200

      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
              http:

      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal

      # Bounds disk usage on a memory/disk-constrained staging VM - traces
      # older than this are dropped, unlike Prometheus/Loki which currently
      # have no equivalent explicit retention cap.
      compactor:
        compaction:
          block_retention: 48h
