# Traefik runs on the host and is shared by multiple projects.
# Services use the existing `proxy` network and the `myresolver` ACME resolver.

# Limit container logs to prevent unbounded disk usage.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    networks:
      - db
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/01-create-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 10s
      retries: 20

  keycloak:
    # Set by the deploy workflow; falls back to `staging` for manual deploys.
    image: ghcr.io/maik-hasler/einsatzbereit-keycloak:${IMAGE_TAG:-staging}
    container_name: keycloak
    restart: unless-stopped
    networks:
      - proxy
      - db
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.00"
    depends_on:
      postgres:
        condition: service_healthy
    # Keycloak has no curl/wget, so use its management endpoint via bash.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/9000 && printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && cat <&3 | grep -q "200 OK"'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KC_HOSTNAME: https://login.maik-hasler.de
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Trust forwarded headers from the Traefik proxy.
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Keep the demo realm accounts available in staging.
      KC_SPI_REALM_IMPORTER_FILE_IMPORT_BEHAVIOR: OVERWRITE_EXISTING
      # Shared with the backend's Keycloak client.
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET:?set KEYCLOAK_BACKEND_SECRET in .env}
      # SMTP settings for email verification and password resets.
      KC_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      KC_SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in .env}
      KC_SMTP_FROM: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env}
      KC_SMTP_USER: ${SMTP_USERNAME:?set SMTP_USERNAME in .env}
      KC_SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.keycloak.rule=Host(`login.maik-hasler.de`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.certresolver=myresolver
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  db-backup:
    image: prodrigestivill/postgres-backup-local:18
    container_name: db-backup
    restart: unless-stopped
    networks:
      - db
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: einsatzbereit,keycloak
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - postgres_backups:/backups

  minio:
    # Pin the image to avoid unexpected upstream releases.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks:
      - proxy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.minio.rule=Host(`storage.maik-hasler.de`)
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls=true
      - traefik.http.routers.minio.tls.certresolver=myresolver
      - traefik.http.services.minio.loadbalancer.server.port=9000

  # Creates the bucket and a bucket-scoped backend account.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - proxy
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET_NAME: einsatzbereit
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set MINIO_APP_ACCESS_KEY in .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in .env}
    configs:
      - source: minio-init-script
        target: /init.sh

  # Daily local and offsite backups.
  minio-backup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks:
      - proxy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.20"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET_NAME: einsatzbereit
      BACKUP_KEEP_DAYS: "7"
      BACKUP_INTERVAL_SECONDS: "86400"
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:?set OFFSITE_S3_ENDPOINT in .env}
      OFFSITE_S3_ACCESS_KEY: ${OFFSITE_S3_ACCESS_KEY:?set OFFSITE_S3_ACCESS_KEY in .env}
      OFFSITE_S3_SECRET_KEY: ${OFFSITE_S3_SECRET_KEY:?set OFFSITE_S3_SECRET_KEY in .env}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-einsatzbereit-backups}
    volumes:
      - minio_backups:/backups
      - postgres_backups:/backup-sources/postgres:ro
    configs:
      - source: minio-backup-script
        target: /backup.sh

  backend:
    image: ghcr.io/maik-hasler/einsatzbereit-backend:${IMAGE_TAG:-staging}
    restart: unless-stopped
    # Match the application's shutdown timeout.
    stop_grace_period: 30s
    networks:
      - proxy
      - db
      - monitoring
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/alive"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Staging}
      Database__MigrateOnStartup: "true"
      # Staging overrides this to seed demo data.
      Database__SeedOnStartup: ${DATABASE_SEED_ON_STARTUP:-false}
      ConnectionStrings__einsatzbereit: "Host=postgres;Database=einsatzbereit;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Authentication__Authority: https://login.maik-hasler.de/realms/einsatzbereit
      Authentication__ValidIssuers__0: https://login.maik-hasler.de/realms/einsatzbereit
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__ClientSecret: ${KEYCLOAK_BACKEND_SECRET:?set KEYCLOAK_BACKEND_SECRET in .env}
      Cors__Origins__0: https://einsatzbereit.maik-hasler.de
      # Public API URL used in email links.
      Api__PublicBaseUrl: https://api.maik-hasler.de
      Storage__Endpoint: http://minio:9000
      # Bucket-scoped credentials, not MinIO root credentials.
      Storage__AccessKey: ${MINIO_APP_ACCESS_KEY:?set MINIO_APP_ACCESS_KEY in .env}
      Storage__SecretKey: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in .env}
      Storage__BucketName: einsatzbereit
      Storage__PublicEndpoint: https://storage.maik-hasler.de
      # Shared SMTP settings.
      Smtp__Host: ${SMTP_HOST:?set SMTP_HOST in .env}
      Smtp__Port: ${SMTP_PORT:?set SMTP_PORT in .env}
      Smtp__Username: ${SMTP_USERNAME:?set SMTP_USERNAME in .env}
      Smtp__Password: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env}
      Smtp__FromName: ${SMTP_FROM_NAME:?set SMTP_FROM_NAME in .env}
      Smtp__EnableSsl: "true"
      # Internal metrics endpoint, not exposed through Traefik.
      Metrics__Port: "8081"
      # Send traces to the internal Tempo instance.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.backend.rule=Host(`api.maik-hasler.de`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=myresolver
      - traefik.http.services.backend.loadbalancer.server.port=8080

  frontend:
    image: ghcr.io/maik-hasler/einsatzbereit-frontend:${IMAGE_TAG:-staging}
    container_name: frontend
    restart: unless-stopped
    networks:
      - proxy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.10"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      VITE_KEYCLOAK_AUTHORITY_URL: https://login.maik-hasler.de/realms/einsatzbereit
      VITE_KEYCLOAK_CLIENT_ID: frontend
      VITE_API_URL: https://api.maik-hasler.de
      STORAGE_PUBLIC_URL: https://storage.maik-hasler.de
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.frontend.rule=Host(`einsatzbereit.maik-hasler.de`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=myresolver
      - traefik.http.services.frontend.loadbalancer.server.port=80

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    volumes:
      - prometheus_data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus-rules
        target: /etc/prometheus/alert.rules.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Sends Prometheus alerts by email.
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    volumes:
      - alertmanager_data:/alertmanager
    configs:
      - source: alertmanager-config
        target: /etc/alertmanager/alertmanager.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Host-level CPU, memory, disk and network metrics.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - proxy
      - monitoring
    logging: *default-logging
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: https://grafana.maik-hasler.de
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/prometheus.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.grafana.rule=Host(`grafana.maik-hasler.de`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=myresolver
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    volumes:
      - loki_data:/loki
    # No healthcheck; the image does not provide a reliable shell/wget.

  # Sends Docker container logs to Loki.
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    # Loki readiness is not required; Alloy retries automatically.
    depends_on:
      - loki
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    configs:
      - source: alloy-config
        target: /etc/alloy/config.alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

  # Stores application traces from the backend.
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    networks:
      - monitoring
    logging: *default-logging
    volumes:
      - tempo_data:/var/tempo
    configs:
      - source: tempo-config
        target: /etc/tempo/tempo.yaml
    command:
      - -config.file=/etc/tempo/tempo.yaml
    # No healthcheck; nothing depends on Tempo readiness.

networks:
  proxy:
    name: proxy
    external: true
  db:
    name: einsatzbereit-db
  monitoring:
    name: einsatzbereit-monitoring

volumes:
  postgres_data:
  postgres_backups:
  minio_data:
  minio_backups:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:

configs:
  postgres-init:
    content: |
      SELECT 'CREATE DATABASE einsatzbereit' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'einsatzbereit')\gexec
      SELECT 'CREATE DATABASE keycloak' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec

  # Creates the backend's bucket-scoped MinIO account.
  minio-init-script:
    content: |
      #!/bin/sh
      set -eu

      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null

      mc mb --ignore-existing "local/$${MINIO_BUCKET_NAME}"

      cat > /tmp/app-policy.json <<POLICY
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:*"],
            "Resource": [
              "arn:aws:s3:::$${MINIO_BUCKET_NAME}",
              "arn:aws:s3:::$${MINIO_BUCKET_NAME}/*"
            ]
          }
        ]
      }
      POLICY

      mc admin policy create local einsatzbereit-app /tmp/app-policy.json

      mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" 2>/dev/null || true

      mc admin policy attach local einsatzbereit-app --user "$$MINIO_APP_ACCESS_KEY" 2>/dev/null || true

      echo "MinIO app service account ready (bucket: $${MINIO_BUCKET_NAME})."

  # Creates daily MinIO snapshots and mirrors them offsite.
  minio-backup-script:
    content: |
      #!/bin/sh
      set -eu

      BUCKET="$${MINIO_BUCKET_NAME:-einsatzbereit}"
      KEEP_DAYS="$${BACKUP_KEEP_DAYS:-7}"
      INTERVAL="$${BACKUP_INTERVAL_SECONDS:-86400}"
      OFFSITE_BUCKET="$${OFFSITE_S3_BUCKET:-einsatzbereit-backups}"

      mc alias set source http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
      mc alias set offsite "$$OFFSITE_S3_ENDPOINT" "$$OFFSITE_S3_ACCESS_KEY" "$$OFFSITE_S3_SECRET_KEY" >/dev/null

      backup_once() {
        stamp="$$(date +%Y-%m-%d)"
        dest="/backups/$${stamp}"
        echo "$$(date -Iseconds) backing up source/$${BUCKET} to $${dest}"
        mc mirror --overwrite --quiet "source/$${BUCKET}" "$${dest}"
      }

      prune_old() {
        list_file=/tmp/.backup-dirs
        : > "$$list_file"
        for d in /backups/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]; do
          [ -d "$$d" ] && echo "$$d" >> "$$list_file"
        done
        sort -o "$$list_file" "$$list_file"
        total=$$(wc -l < "$$list_file")
        excess=$$((total - KEEP_DAYS))
        if [ "$$excess" -gt 0 ]; then
          head -n "$$excess" "$$list_file" | while read -r old; do
            echo "$$(date -Iseconds) pruning $${old}"
            rm -rf "$${old}"
          done
        fi
      }

      offsite_sync() {
        echo "$$(date -Iseconds) mirroring local backups to offsite/$${OFFSITE_BUCKET}"
        mc mirror --overwrite --remove --quiet /backups "offsite/$${OFFSITE_BUCKET}/minio"
        mc mirror --overwrite --remove --quiet /backup-sources/postgres "offsite/$${OFFSITE_BUCKET}/postgres"
      }

      while true; do
        backup_once
        prune_old
        offsite_sync
        sleep "$$INTERVAL"
      done

  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      alerting:
        alertmanagers:
          - static_configs:
              - targets: ["alertmanager:9093"]

      rule_files:
        - /etc/prometheus/alert.rules.yml

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: node-exporter
          static_configs:
            - targets: ["node-exporter:9100"]

        # Use port 8081 and discover all backend replicas.
        - job_name: backend
          dns_sd_configs:
            - names: ["backend"]
              type: A
              port: 8081
              refresh_interval: 30s

  # Alerts when a scrape target is unavailable for 2 minutes.
  prometheus-rules:
    content: |
      groups:
        - name: staging-availability
          rules:
            - alert: InstanceDown
              expr: up == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "{{ $$labels.job }} instance {{ $$labels.instance }} is down"
                description: "Prometheus has not been able to scrape {{ $$labels.job }} ({{ $$labels.instance }}) for more than 2 minutes."

  alertmanager-config:
    content: |
      global:
        smtp_smarthost: '${SMTP_HOST:?set SMTP_HOST in .env}:${SMTP_PORT:?set SMTP_PORT in .env}'
        smtp_from: '${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env}'
        smtp_auth_username: '${SMTP_USERNAME:?set SMTP_USERNAME in .env}'
        smtp_auth_password: '${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}'
        smtp_require_tls: true

      route:
        receiver: default
        group_by: ['alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

      receivers:
        - name: default
          email_configs:
            - to: '${ALERT_NOTIFICATION_EMAIL:?set ALERT_NOTIFICATION_EMAIL in .env}'
              send_resolved: true

  grafana-datasources:
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          editable: false
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          editable: false
        - name: Alertmanager
          type: alertmanager
          access: proxy
          url: http://alertmanager:9093
          editable: false
          jsonData:
            implementation: prometheus

  alloy-config:
    content: |
      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      discovery.relabel "containers" {
        targets = discovery.docker.containers.targets

        # Only collect containers belonging to this Compose project.
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_project"]
          regex         = "einsatzbereit"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
      }

      loki.source.docker "default" {
        host          = "unix:///var/run/docker.sock"
        targets       = discovery.docker.containers.targets
        labels        = {"job" = "docker"}
        relabel_rules = discovery.relabel.containers.rules
        forward_to    = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

  tempo-config:
    content: |
      server:
        http_listen_port: 3200

      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
              http:

      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal

      # Keep staging traces for 48 hours.
      compactor:
        compaction:
          block_retention: 48h
