# Traefik runs as a host-level container outside this stack (shared across
# multiple projects on the same host). Our services attach to the existing
# proxy network and register routes via labels - they expect a Traefik
# instance with the `myresolver` ACME resolver already configured.
services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    networks:
      - db
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/01-create-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 10s
      retries: 20

  keycloak:
    image: ghcr.io/maik-hasler/einsatzbereit-keycloak:staging
    container_name: keycloak
    restart: unless-stopped
    networks:
      - proxy
      - db
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.00"
    depends_on:
      postgres:
        condition: service_healthy
    # The Keycloak image ships no curl/wget, so probe the management health
    # endpoint (port 9000) over bash's /dev/tcp instead. /bin/sh is bash on the
    # UBI-based image, but we invoke bash explicitly for clarity and parity with
    # the backend (whose /bin/sh is dash and cannot do /dev/tcp).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/9000 && printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && cat <&3 | grep -q "200 OK"'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KC_HOSTNAME: https://login.maik-hasler.de
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_SPI_REALM_IMPORTER_FILE_IMPORT_BEHAVIOR: OVERWRITE_EXISTING
      # Resolves the "${KEYCLOAK_BACKEND_SECRET}" placeholder in the imported
      # realm JSON (keycloak/realms/einsatzbereit-realm.json) into the backend
      # client's actual secret. Must match the backend service's own
      # Keycloak__ClientSecret below.
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET:?set KEYCLOAK_BACKEND_SECRET in .env}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.keycloak.rule=Host(`login.maik-hasler.de`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.certresolver=myresolver
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  db-backup:
    image: prodrigestivill/postgres-backup-local:18
    container_name: db-backup
    restart: unless-stopped
    networks:
      - db
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: einsatzbereit,keycloak
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - postgres_backups:/backups

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.minio.rule=Host(`storage.maik-hasler.de`)
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls=true
      - traefik.http.routers.minio.tls.certresolver=myresolver
      - traefik.http.services.minio.loadbalancer.server.port=9000

  backend:
    image: ghcr.io/maik-hasler/einsatzbereit-backend:staging
    container_name: backend
    restart: unless-stopped
    networks:
      - proxy
      - db
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    # curl is installed in the Dockerfile (as root before switching to $APP_UID).
    # /alive (not /health) is used so the container is gated on the app being up,
    # not on downstream readiness, which avoids dependency deadlocks.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/alive"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
      ConnectionStrings__einsatzbereit: "Host=postgres;Database=einsatzbereit;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Authentication__Authority: https://login.maik-hasler.de/realms/einsatzbereit
      Authentication__ValidIssuers__0: https://login.maik-hasler.de/realms/einsatzbereit
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__ClientSecret: ${KEYCLOAK_BACKEND_SECRET:?set KEYCLOAK_BACKEND_SECRET in .env}
      Cors__Origins__0: https://einsatzbereit.maik-hasler.de
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      Storage__BucketName: einsatzbereit
      Storage__PublicEndpoint: https://storage.maik-hasler.de
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.backend.rule=Host(`api.maik-hasler.de`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=myresolver
      - traefik.http.services.backend.loadbalancer.server.port=8080

  frontend:
    image: ghcr.io/maik-hasler/einsatzbereit-frontend:staging
    container_name: frontend
    restart: unless-stopped
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.10"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      VITE_KEYCLOAK_AUTHORITY_URL: https://login.maik-hasler.de/realms/einsatzbereit
      VITE_KEYCLOAK_CLIENT_ID: frontend
      VITE_API_URL: https://api.maik-hasler.de
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.frontend.rule=Host(`einsatzbereit.maik-hasler.de`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=myresolver
      - traefik.http.services.frontend.loadbalancer.server.port=80

networks:
  proxy:
    name: proxy
    external: true
  db:
    name: einsatzbereit-db

volumes:
  postgres_data:
  postgres_backups:
  minio_data:

configs:
  postgres-init:
    content: |
      SELECT 'CREATE DATABASE einsatzbereit' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'einsatzbereit')\gexec
      SELECT 'CREATE DATABASE keycloak' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec
