# Traefik runs as a host-level container outside this stack (shared across
# multiple projects on the same host). Our services attach to the existing
# proxy network and register routes via labels - they expect a Traefik
# instance with the `myresolver` ACME resolver already configured.
#
# Every service below shares the same `logging: *default-logging` driver
# config (json-file, capped at 10m x 3 files) - without it, container stdout
# grows unbounded on the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    networks:
      - db
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/01-create-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 10s
      retries: 20
    labels:
      - logs.scrape=true

  keycloak:
    # Set by publish.yml's deploy jobs to the exact version tag being released,
    # never a floating one, so a bad deploy has an immutable prior version to
    # roll back to. The "staging" fallback applies only when IMAGE_TAG is unset
    # entirely, e.g. a manual `docker compose up` on a fresh host.
    image: ghcr.io/maik-hasler/einsatzbereit-keycloak:${IMAGE_TAG:-staging}
    container_name: keycloak
    restart: unless-stopped
    networks:
      - proxy
      - db
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.00"
    depends_on:
      postgres:
        condition: service_healthy
    # The Keycloak image ships no curl/wget, so probe the management health
    # endpoint (port 9000) over bash's /dev/tcp instead. /bin/sh is bash on the
    # UBI-based image, but we invoke bash explicitly for clarity and parity with
    # the backend (whose /bin/sh is dash and cannot do /dev/tcp).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/9000 && printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && cat <&3 | grep -q "200 OK"'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KC_HOSTNAME: https://login.maik-hasler.de
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Without this, Keycloak 26 ignores X-Forwarded-For and attributes every
      # request to the Traefik container's internal IP, so login/admin-event
      # records and any IP-based brute-force policy are useless.
      # Safe only because Traefik is the sole ingress on the `proxy` network -
      # nothing else can reach Keycloak to spoof the header end-to-end.
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Deliberately keeps the einsatzbereit realm's baked-in vera/olaf/admin demo
      # accounts (and their public, documented passwords) alive across restarts -
      # staging is disposable demo/QA infrastructure, not production, and these
      # accounts are meant to be publicly known and instantly restorable rather
      # than rotated or hardened. See keycloak/AGENTS.md.
      KC_SPI_REALM_IMPORTER_FILE_IMPORT_BEHAVIOR: OVERWRITE_EXISTING
      # Resolves the "${KEYCLOAK_BACKEND_SECRET}" placeholder in the imported
      # realm JSON (keycloak/realms/einsatzbereit-realm.json) into the backend
      # client's actual secret. Must match the backend service's own
      # Keycloak__ClientSecret below.
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET:?set KEYCLOAK_BACKEND_SECRET in .env}
      # Resolves the realm's smtpServer "${KC_SMTP_*}" placeholders so
      # verifyEmail/resetPasswordAllowed can deliver mail. Same mailbox
      # credentials as the backend's Smtp__* below.
      KC_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      KC_SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in .env}
      KC_SMTP_FROM: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env}
      KC_SMTP_USER: ${SMTP_USERNAME:?set SMTP_USERNAME in .env}
      KC_SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.keycloak.rule=Host(`login.maik-hasler.de`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.certresolver=myresolver
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      - logs.scrape=true

  db-backup:
    image: prodrigestivill/postgres-backup-local:18
    container_name: db-backup
    restart: unless-stopped
    networks:
      - db
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: einsatzbereit,keycloak
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - postgres_backups:/backups
    labels:
      - logs.scrape=true

  minio:
    # Pinned, not :latest - Renovate tracks new RELEASE.* tags, so upstream
    # releases land in a reviewed PR rather than on the next deploy's pull.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks:
      - proxy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.minio.rule=Host(`storage.maik-hasler.de`)
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls=true
      - traefik.http.routers.minio.tls.certresolver=myresolver
      - traefik.http.services.minio.loadbalancer.server.port=9000
      - logs.scrape=true

  # One-shot bootstrap: creates the "einsatzbereit" bucket and a bucket-scoped
  # service account, so the backend never holds MinIO's root credentials - a
  # leak can then only touch this one bucket. Re-runs on every deploy; every
  # step below is idempotent.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - proxy
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET_NAME: einsatzbereit
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set MINIO_APP_ACCESS_KEY in .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in .env}
    configs:
      - source: minio-init-script
        target: /init.sh
    labels:
      - logs.scrape=true

  # Daily snapshot of the "einsatzbereit" bucket into its own volume,
  # mirroring db-backup's role for Postgres. Also mirrors both local backup
  # volumes (this one's output plus db-backup's postgres_backups) offsite to
  # Hetzner Object Storage on the same cadence, in this same container.
  minio-backup:
    # Pinned for the same reason as minio's own image above.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks:
      - proxy
    logging: *default-logging
    # Higher than a single-purpose mirror needs - this process handles both
    # the local mirror and the offsite replication of two datasets.
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.20"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET_NAME: einsatzbereit
      # Mirrors db-backup's BACKUP_KEEP_DAYS (see above) - no weekly/monthly
      # tiers here, unlike db-backup, since a daily full mirror of MinIO's
      # (much smaller, less write-heavy) bucket is cheap enough that one flat
      # retention window is proportionate rather than under-engineered.
      BACKUP_KEEP_DAYS: "7"
      BACKUP_INTERVAL_SECONDS: "86400"
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:?set OFFSITE_S3_ENDPOINT in .env}
      OFFSITE_S3_ACCESS_KEY: ${OFFSITE_S3_ACCESS_KEY:?set OFFSITE_S3_ACCESS_KEY in .env}
      OFFSITE_S3_SECRET_KEY: ${OFFSITE_S3_SECRET_KEY:?set OFFSITE_S3_SECRET_KEY in .env}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-einsatzbereit-backups}
    volumes:
      - minio_backups:/backups
      - postgres_backups:/backup-sources/postgres:ro
    configs:
      - source: minio-backup-script
        target: /backup.sh
    labels:
      - logs.scrape=true

  backend:
    image: ghcr.io/maik-hasler/einsatzbereit-backend:${IMAGE_TAG:-staging}
    # No container_name: a fixed name forbids `docker compose up --scale
    # backend=N`. Traefik merges containers sharing the same
    # traefik.http.routers.backend.* labels into one load-balanced service.
    #
    # Scaling is still blocked by Database__MigrateOnStartup below: two replicas
    # booting together would apply pending EF Core migrations concurrently with
    # no lock. Needs a leader step or a Postgres advisory lock first.
    restart: unless-stopped
    # Compose's default stop_grace_period (10s) is shorter than .NET's own
    # shutdown timeout (30s), so `docker compose down`/`up --remove-orphans`
    # on every deploy could SIGKILL the backend mid-shutdown before
    # OutboxProcessorJob/EngagementReminderJob finish their current
    # iteration. Match .NET's timeout instead of cutting it short.
    stop_grace_period: 30s
    networks:
      - proxy
      - db
      - monitoring
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # curl is installed in the Dockerfile (as root before switching to $APP_UID).
    # /alive (not /health) is used so the container is gated on the app being up,
    # not on downstream readiness, which avoids dependency deadlocks.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/alive"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Staging}
      Database__MigrateOnStartup: "true"
      # Defaults to false so a fresh non-staging deployment of this compose
      # file doesn't come up populated with the fictional "Lindenauer" demo
      # organizations/opportunities from ApplicationDbContextInitializer.
      # The staging deploy job (publish.yml) explicitly overrides this to
      # "true" in the rendered .env - staging is meant to come back seeded
      #.
      Database__SeedOnStartup: ${DATABASE_SEED_ON_STARTUP:-false}
      ConnectionStrings__einsatzbereit: "Host=postgres;Database=einsatzbereit;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Authentication__Authority: https://login.maik-hasler.de/realms/einsatzbereit
      Authentication__ValidIssuers__0: https://login.maik-hasler.de/realms/einsatzbereit
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__ClientSecret: ${KEYCLOAK_BACKEND_SECRET:?set KEYCLOAK_BACKEND_SECRET in .env}
      Cors__Origins__0: https://einsatzbereit.maik-hasler.de
      # Backend's own public origin - embedded in one-click unsubscribe
      # links sent in transactional emails, which must resolve from outside the
      # docker network. Distinct from Cors__Origins__0 above, which is the
      # frontend's origin.
      Api__PublicBaseUrl: https://api.maik-hasler.de
      Storage__Endpoint: http://minio:9000
      # Bucket-scoped app credentials (minio-init), not MinIO's root
      # user - a leaked value here can only touch this one bucket, not
      # administer the whole MinIO instance.
      Storage__AccessKey: ${MINIO_APP_ACCESS_KEY:?set MINIO_APP_ACCESS_KEY in .env}
      Storage__SecretKey: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in .env}
      Storage__BucketName: einsatzbereit
      Storage__PublicEndpoint: https://storage.maik-hasler.de
      # Same mailbox as the keycloak service's KC_SMTP_* above.
      Smtp__Host: ${SMTP_HOST:?set SMTP_HOST in .env}
      Smtp__Port: ${SMTP_PORT:?set SMTP_PORT in .env}
      Smtp__Username: ${SMTP_USERNAME:?set SMTP_USERNAME in .env}
      Smtp__Password: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env}
      Smtp__FromName: ${SMTP_FROM_NAME:?set SMTP_FROM_NAME in .env}
      Smtp__EnableSsl: "true"
      # Second Kestrel listener, scraped by prometheus over the "monitoring"
      # network above. Deliberately not a value from .env/secrets - it isn't
      # sensitive, and the safety property that matters (not publicly
      # reachable) comes from Traefik's backend router below only ever
      # pointing at port 8080, never 8081.
      Metrics__Port: "8081"
      # Read by ServiceDefaults/Extensions.cs's AddOpenTelemetryExporters -
      # enables the OTLP trace exporter, which is otherwise a no-op. Plain
      # http (no TLS) is fine: this traffic never leaves the internal
      # "monitoring" network above. gRPC is the exporter's default protocol,
      # so no separate OTEL_EXPORTER_OTLP_PROTOCOL is needed for tempo's
      # matching gRPC receiver on 4317.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.backend.rule=Host(`api.maik-hasler.de`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=myresolver
      - traefik.http.services.backend.loadbalancer.server.port=8080
      - prometheus.scrape=true
      - prometheus.port=8081
      - logs.scrape=true

  frontend:
    image: ghcr.io/maik-hasler/einsatzbereit-frontend:${IMAGE_TAG:-staging}
    container_name: frontend
    restart: unless-stopped
    networks:
      - proxy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.10"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      VITE_KEYCLOAK_AUTHORITY_URL: https://login.maik-hasler.de/realms/einsatzbereit
      VITE_KEYCLOAK_CLIENT_ID: frontend
      VITE_API_URL: https://api.maik-hasler.de
      STORAGE_PUBLIC_URL: https://storage.maik-hasler.de
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.frontend.rule=Host(`einsatzbereit.maik-hasler.de`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=myresolver
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - logs.scrape=true

networks:
  proxy:
    name: proxy
    external: true
  db:
    name: einsatzbereit-db
  monitoring:
    name: monitoring
    external: true

volumes:
  postgres_data:
  postgres_backups:
  minio_data:
  minio_backups:

configs:
  postgres-init:
    content: |
      SELECT 'CREATE DATABASE einsatzbereit' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'einsatzbereit')\gexec
      SELECT 'CREATE DATABASE keycloak' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec
  # Bootstraps the bucket-scoped app service account - see the
  # minio-init service above. Idempotent: safe to re-run on every deploy.
  # Same `$$` escaping convention as minio-backup-script below.
  minio-init-script:
    content: |
      #!/bin/sh
      set -eu

      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null

      mc mb --ignore-existing "local/$${MINIO_BUCKET_NAME}"

      cat > /tmp/app-policy.json <<POLICY
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:*"],
            "Resource": [
              "arn:aws:s3:::$${MINIO_BUCKET_NAME}",
              "arn:aws:s3:::$${MINIO_BUCKET_NAME}/*"
            ]
          }
        ]
      }
      POLICY

      mc admin policy create local einsatzbereit-app /tmp/app-policy.json

      mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" 2>/dev/null || true

      mc admin policy attach local einsatzbereit-app --user "$$MINIO_APP_ACCESS_KEY" 2>/dev/null || true

      echo "MinIO app service account ready (bucket: $${MINIO_BUCKET_NAME})."
  # Backs up the einsatzbereit bucket to /backups/<YYYY-MM-DD>, once per
  # BACKUP_INTERVAL_SECONDS, pruning down to BACKUP_KEEP_DAYS snapshots after
  # each run. `find` is not available in the minio/mc image (RHEL9-UBI-based,
  # no findutils) - the directory listing/pruning below deliberately uses
  # only shell globbing plus sort/wc/head/rm, all confirmed present in that
  # image, instead.
  # Every `$` below is doubled (`$$`) - compose interpolates `${...}`/`$VAR`
  # in config content the same as anywhere else in this file, so a single `$`
  # here would be silently resolved (usually to blank, since these are
  # script-local shell variables Compose has never heard of) before the
  # script ever reaches the container. `$$` escapes to a literal `$`, which
  # is what the container's own /bin/sh needs to see.
  minio-backup-script:
    content: |
      #!/bin/sh
      set -eu

      BUCKET="$${MINIO_BUCKET_NAME:-einsatzbereit}"
      KEEP_DAYS="$${BACKUP_KEEP_DAYS:-7}"
      INTERVAL="$${BACKUP_INTERVAL_SECONDS:-86400}"
      OFFSITE_BUCKET="$${OFFSITE_S3_BUCKET:-einsatzbereit-backups}"

      mc alias set source http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
      mc alias set offsite "$$OFFSITE_S3_ENDPOINT" "$$OFFSITE_S3_ACCESS_KEY" "$$OFFSITE_S3_SECRET_KEY" >/dev/null

      backup_once() {
        stamp="$$(date +%Y-%m-%d)"
        dest="/backups/$${stamp}"
        echo "$$(date -Iseconds) backing up source/$${BUCKET} to $${dest}"
        mc mirror --overwrite --quiet "source/$${BUCKET}" "$${dest}"
      }

      prune_old() {
        list_file=/tmp/.backup-dirs
        : > "$$list_file"
        for d in /backups/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]; do
          [ -d "$$d" ] && echo "$$d" >> "$$list_file"
        done
        sort -o "$$list_file" "$$list_file"
        total=$$(wc -l < "$$list_file")
        excess=$$((total - KEEP_DAYS))
        if [ "$$excess" -gt 0 ]; then
          head -n "$$excess" "$$list_file" | while read -r old; do
            echo "$$(date -Iseconds) pruning $${old}"
            rm -rf "$${old}"
          done
        fi
      }

      # --remove propagates deletions too, not just new/changed files - both
      # sources above already get pruned to their own retention window, and
      # without --remove the offsite bucket would never shed what they've
      # pruned, growing unbounded instead of mirroring the same retention.
      offsite_sync() {
        echo "$$(date -Iseconds) mirroring local backups to offsite/$${OFFSITE_BUCKET}"
        mc mirror --overwrite --remove --quiet /backups "offsite/$${OFFSITE_BUCKET}/minio"
        mc mirror --overwrite --remove --quiet /backup-sources/postgres "offsite/$${OFFSITE_BUCKET}/postgres"
      }

      while true; do
        backup_once
        prune_old
        offsite_sync
        sleep "$$INTERVAL"
      done
