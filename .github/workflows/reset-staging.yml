name: Reset Staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm - this permanently deletes all staging data (Postgres + Keycloak + MinIO). Currently running images/tags are kept.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  reset-staging:
    name: Reset Staging Data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Verify confirmation
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM_INPUT" != "RESET" ]; then
            echo "::error::Confirmation input must be exactly 'RESET' to proceed. Got: '$CONFIRM_INPUT'"
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key from a secret, not ssh-keyscan's live result -
          # this is a destructive workflow (wipes Postgres + MinIO data), so
          # it should be at least as strict as deploy-staging about not
          # trusting whatever host key a DNS/BGP hijack of STAGING_SSH_HOST
          # would otherwise hand it (#1733). See publish.yml's matching step
          # and .github/AGENTS.md for how STAGING_SSH_HOST_KEY was captured.
          echo "${{ secrets.STAGING_SSH_HOST_KEY }}" >> ~/.ssh/known_hosts

      # Read before "Copy .env" below overwrites the host's .env - without
      # this, the render below had no IMAGE_TAG line at all, so
      # docker-compose.yml's `${IMAGE_TAG:-staging}` default silently took
      # over on restart, which could resurrect an old cached `staging`-tagged
      # image instead of whatever version (RC or stable) was actually
      # running before the reset (#1733).
      - name: Capture currently deployed image tag
        id: current_tag
        run: |
          set -euo pipefail
          TAG=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" bash -s <<'EOF'
            if [ -f /opt/einsatzbereit/.env ]; then
              grep -m1 '^IMAGE_TAG=' /opt/einsatzbereit/.env | cut -d'"' -f2
            fi
          EOF
          )
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "Currently deployed IMAGE_TAG: ${TAG} - reset will restart with this same version."
          else
            echo "::warning::No IMAGE_TAG found in the host's current .env - reset will fall back to docker-compose.yml's default (staging), which may not match what is actually running."
          fi

      # Without this, the restart below reuses whatever .env is already on
      # the host from the last deploy-staging run - so a secret rotated
      # since then (a changed password, a fixed typo) silently keeps not
      # applying, which is exactly the confusing state this workflow exists
      # to get out of. Kept byte-for-byte in sync with publish.yml's own
      # "Render .env" step - see that step's secrets list before assuming
      # this one is complete.
      - name: Render .env
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_BACKEND_SECRET: ${{ secrets.KEYCLOAK_BACKEND_SECRET }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_APP_ACCESS_KEY: ${{ secrets.MINIO_APP_ACCESS_KEY }}
          MINIO_APP_SECRET_KEY: ${{ secrets.MINIO_APP_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          # Where Alertmanager sends alert emails (docker-compose.yml's
          # alertmanager-config, #1081) - required (":?" guard), so a restart
          # without it fails rendering the compose config entirely, same as
          # deploy-staging.
          ALERT_NOTIFICATION_EMAIL: ${{ secrets.ALERT_NOTIFICATION_EMAIL }}
          # Off-host mirror target for minio-backup's offsite leg
          # (docker-compose.yml, #1087) - also required (":?" guard), so a
          # restart without these fails the same way ALERT_NOTIFICATION_EMAIL
          # above does. See deploy-staging's matching secrets in publish.yml.
          OFFSITE_S3_ENDPOINT: ${{ secrets.OFFSITE_S3_ENDPOINT }}
          OFFSITE_S3_ACCESS_KEY: ${{ secrets.OFFSITE_S3_ACCESS_KEY }}
          OFFSITE_S3_SECRET_KEY: ${{ secrets.OFFSITE_S3_SECRET_KEY }}
          # Whatever was actually running before the reset (captured above),
          # not docker-compose.yml's "staging" default - see the "Capture
          # currently deployed image tag" step above (#1733).
          IMAGE_TAG: ${{ steps.current_tag.outputs.tag }}
        run: |
          umask 077
          # Escape \, " and $ so secrets that contain quotes, hashes, leading
          # apostrophes, or a literal $ (which Compose's .env parser would
          # otherwise treat as a self-referential ${VAR} lookup, silently
          # dropping everything from the $ onward - see docker-compose.yml's
          # minio-init-script comment on the same Compose behavior) don't
          # break the parser or corrupt the value.
          escape() {
            local v="$1"
            v="${v//\\/\\\\}"
            v="${v//\$/\$\$}"
            v="${v//\"/\\\"}"
            printf '%s' "$v"
          }
          {
            printf 'POSTGRES_USER="%s"\n' "$(escape "$POSTGRES_USER")"
            printf 'POSTGRES_PASSWORD="%s"\n' "$(escape "$POSTGRES_PASSWORD")"
            printf 'KEYCLOAK_ADMIN_USER="%s"\n' "$(escape "$KEYCLOAK_ADMIN_USER")"
            printf 'KEYCLOAK_ADMIN_PASSWORD="%s"\n' "$(escape "$KEYCLOAK_ADMIN_PASSWORD")"
            printf 'KEYCLOAK_BACKEND_SECRET="%s"\n' "$(escape "$KEYCLOAK_BACKEND_SECRET")"
            printf 'MINIO_ROOT_USER="%s"\n' "$(escape "$MINIO_ROOT_USER")"
            printf 'MINIO_ROOT_PASSWORD="%s"\n' "$(escape "$MINIO_ROOT_PASSWORD")"
            printf 'MINIO_APP_ACCESS_KEY="%s"\n' "$(escape "$MINIO_APP_ACCESS_KEY")"
            printf 'MINIO_APP_SECRET_KEY="%s"\n' "$(escape "$MINIO_APP_SECRET_KEY")"
            printf 'SMTP_HOST="%s"\n' "$(escape "$SMTP_HOST")"
            printf 'SMTP_PORT="%s"\n' "$(escape "$SMTP_PORT")"
            printf 'SMTP_USERNAME="%s"\n' "$(escape "$SMTP_USERNAME")"
            printf 'SMTP_PASSWORD="%s"\n' "$(escape "$SMTP_PASSWORD")"
            printf 'SMTP_FROM_ADDRESS="%s"\n' "$(escape "$SMTP_FROM_ADDRESS")"
            printf 'SMTP_FROM_NAME="%s"\n' "$(escape "$SMTP_FROM_NAME")"
            printf 'GRAFANA_ADMIN_USER="%s"\n' "$(escape "$GRAFANA_ADMIN_USER")"
            printf 'GRAFANA_ADMIN_PASSWORD="%s"\n' "$(escape "$GRAFANA_ADMIN_PASSWORD")"
            printf 'ALERT_NOTIFICATION_EMAIL="%s"\n' "$(escape "$ALERT_NOTIFICATION_EMAIL")"
            printf 'OFFSITE_S3_ENDPOINT="%s"\n' "$(escape "$OFFSITE_S3_ENDPOINT")"
            printf 'OFFSITE_S3_ACCESS_KEY="%s"\n' "$(escape "$OFFSITE_S3_ACCESS_KEY")"
            printf 'OFFSITE_S3_SECRET_KEY="%s"\n' "$(escape "$OFFSITE_S3_SECRET_KEY")"
            printf 'IMAGE_TAG="%s"\n' "$(escape "$IMAGE_TAG")"
            # Not a secret - restarting after a reset should come back seeded
            # with demo organizations/opportunities, same as deploy-staging
            # (see publish.yml's "Render .env" step and this workflow's
            # header comment on SeedAsync's idempotency).
            printf 'DATABASE_SEED_ON_STARTUP="true"\n'
          } > .env

      - name: Copy .env
        run: |
          scp -i ~/.ssh/id_ed25519 .env \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/opt/einsatzbereit/"

      - name: Wipe data volumes and restart stack
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" bash -s <<'EOF'
            set -euo pipefail
            cd /opt/einsatzbereit

            echo "Stopping stack..."
            docker compose down

            # postgres_data holds both the "einsatzbereit" and "keycloak" databases
            # (single Postgres instance, see docker-compose.yml). minio_data holds
            # uploaded files. grafana_data holds Grafana's own admin account -
            # GF_SECURITY_ADMIN_USER/PASSWORD only apply on a completely empty
            # volume, so it has to be wiped here too or a changed
            # GRAFANA_ADMIN_PASSWORD secret silently stops matching the live
            # account. postgres_backups and minio_backups are deliberately
            # NOT removed - they are the safety net if this reset needs to
            # be walked back.
            echo "Removing data volumes (postgres_data, minio_data, grafana_data)..."
            docker volume rm einsatzbereit_postgres_data einsatzbereit_minio_data einsatzbereit_grafana_data

            # No `docker compose pull` here on purpose: we restart with whatever
            # images are already cached locally, i.e. the exact same tags/versions
            # that were running before the reset. Only data is wiped.
            echo "Starting stack..."
            docker compose up -d --remove-orphans
          EOF

      - name: Post-reset health gate
        run: |
          set -uo pipefail
          echo "Waiting for https://api.maik-hasler.de/health to report ready..."
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" https://api.maik-hasler.de/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP 200) after attempt $i."
              exit 0
            fi
            echo "Attempt $i/30: /health -> $code; retrying in 10s..."
            sleep 10
          done
          echo "::error::API did not report healthy within 5 minutes after reset."
          exit 1

      - name: Capture container logs on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" bash -s <<'EOF'
            set +e
            cd /opt/einsatzbereit
            for svc in backend keycloak postgres minio grafana; do
              echo "::group::docker inspect ${svc} (state)"
              docker inspect -f 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}' "${svc}" 2>&1 || true
              echo "::endgroup::"
              echo "::group::docker logs ${svc} (tail 200)"
              docker logs --tail 200 "${svc}" 2>&1 || true
              echo "::endgroup::"
            done
          EOF
