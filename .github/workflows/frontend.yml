name: Build Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fake example.test origins - the released frontend image resolves its real
  # origins at container start, so this gate only needs well-formed ones.
  # publish.yml calls the same reusable workflow before a release goes out,
  # so the PR gate and the release gate cannot drift apart - see #1733.
  checks:
    uses: ./.github/workflows/frontend-checks.yml
    with:
      vite_keycloak_authority_url: https://login.example.test/realms/einsatzbereit
      vite_keycloak_client_id: frontend
      keycloak_origin: https://login.example.test
      vite_api_url: https://api.example.test
      storage_public_url: https://storage.example.test
