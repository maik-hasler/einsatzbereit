name: Build Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fake example.test origins - this is the PR/push gate, run against
  # untrusted branches with no access to real infrastructure. publish.yml
  # calls the same reusable workflow with the real maik-hasler.de origins
  # before a release goes out - see #1733.
  checks:
    uses: ./.github/workflows/frontend-checks.yml
    with:
      vite_keycloak_authority_url: https://login.example.test/realms/einsatzbereit
      vite_keycloak_client_id: frontend
      keycloak_origin: https://login.example.test
      vite_api_url: https://api.example.test
      storage_public_url: https://storage.example.test
