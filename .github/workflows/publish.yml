name: Publish

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # Single restore+build for the whole solution, shared by the three test
  # jobs below via upload-artifact/download-artifact instead of each of them
  # redoing it - see the matching job in dotnet.yml for the full rationale.
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Building the whole solution here compiles tests/VisualTests.csproj,
      # which downloads Chrome for Testing + Chrome Headless Shell (~290 MiB
      # combined) from cdn.playwright.dev via its InstallPlaywrightBrowsers
      # MSBuild target. Caching this means that download only happens when
      # the pinned TUnit.Playwright version changes, not on every RC cut.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}

      - name: Restore backend
        working-directory: backend
        run: dotnet restore

      - name: Build backend
        working-directory: backend
        run: dotnet build --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-build
          path: |
            backend/**/bin/**
            backend/**/obj/**
          # See the matching step in dotnet.yml - tests/VisualTests's
          # Playwright driver lives under a dot-prefixed bin/.../.playwright/
          # folder that upload-artifact excludes by default.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  backend-fast-tests:
    name: Backend Fast Tests
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      # See the matching step in dotnet.yml - artifact zip/unzip drops the
      # Unix executable bit on the native apphost binaries `dotnet run`
      # launches directly.
      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - name: Test - Application.UnitTests
        working-directory: backend
        run: dotnet run --project tests/Application.UnitTests --no-restore --no-build

      - name: Test - ArchitectureTests
        working-directory: backend
        run: dotnet run --project tests/ArchitectureTests --no-restore --no-build

  backend-integration-tests:
    name: Backend Integration Tests
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      # See the matching step in dotnet.yml - artifact zip/unzip drops the
      # Unix executable bit on the native apphost binaries `dotnet run`
      # launches directly.
      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.2
          docker pull ghcr.io/axllent/mailpit:latest
          docker pull quay.io/minio/minio:latest

      - name: Test - IntegrationTests (Aspire + Docker)
        working-directory: backend
        run: dotnet run --project tests/IntegrationTests --no-restore --no-build

  # Sharded exactly as dotnet.yml's visual-tests job is - see that job's comment
  # for why (einsatzbereit#2145). The two must stay in step: this is the same
  # suite gating a release that the PR gate runs, so a split that only existed on
  # one side would mean the release path and the PR path disagree about how long
  # the gate takes and which tests ran together.
  backend-visual-tests:
    name: Backend Visual Tests (shard ${{ matrix.shard }})
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      # See the matching step in dotnet.yml - artifact zip/unzip drops the
      # Unix executable bit on the native apphost binaries `dotnet run`
      # launches directly.
      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # See the matching step in dotnet.yml's visual-tests job for why this
      # cache exists, and this job's backend-build job for why it needs
      # restoring again here (a different runner from the one that populated
      # it - needs: backend-build guarantees this lands after that save).
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.2
          docker pull ghcr.io/axllent/mailpit:latest
          docker pull quay.io/minio/minio:latest

      # strategy.job-total is the matrix length, so the shard count is never
      # written down twice and can't drift from the `shard:` list above.
      - name: Resolve shard filter
        id: shard
        run: |
          shard=$(.github/scripts/visual-test-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}")
          echo "$shard"
          echo "$shard" >> "$GITHUB_OUTPUT"

      - name: Test - VisualTests (Aspire + Docker + Playwright)
        working-directory: backend
        run: |
          dotnet run --project tests/VisualTests --no-restore --no-build -- \
            --treenode-filter "${{ steps.shard.outputs.filter }}" \
            --minimum-expected-tests "${{ steps.shard.outputs.min-tests }}"

      # #2145's first acceptance criterion: the fixed per-shard Aspire boot is
      # what decides how many shards are still worth adding, so keep measuring it
      # rather than re-deriving it from step timestamps once. AspireFixture writes
      # the file at the end of InitializeAsync.
      - name: Report Aspire stack startup cost
        if: always()
        working-directory: backend
        run: |
          timing=$(find tests/VisualTests/bin -name aspire-boot-seconds.txt -print -quit 2>/dev/null || true)
          if [ -n "$timing" ]; then
            echo "shard ${{ matrix.shard }}: Aspire stack ready in $(cat "$timing")s" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::shard ${{ matrix.shard }}: no Aspire boot timing recorded - the stack never finished starting"
          fi

  publish-backend:
    name: Publish Backend
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NAME: ${{ github.repository }}-backend
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=staging,enable=${{ steps.version.outputs.prerelease == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/src/Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Runs the exact same lint/format/i18n/nginx-header/type-check/unit-test/
  # production-container-smoke-test gate as frontend.yml's PR/push gate,
  # against the real maik-hasler.de origins this release will actually be
  # deployed with - see #1733: before this, publish-frontend below ran only
  # pnpm lint/check/test/build inline and never built or smoke-tested the
  # production nginx image at all, so the release path skipped the nginx
  # CSP/HSTS/Permissions-Policy checks and the image build guarding the
  # artifact actually being pushed and deployed.
  frontend-checks:
    name: Frontend Checks
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests]
    uses: ./.github/workflows/frontend-checks.yml
    with:
      vite_keycloak_authority_url: https://login.maik-hasler.de/realms/einsatzbereit
      vite_keycloak_client_id: frontend
      keycloak_origin: https://login.maik-hasler.de
      vite_api_url: https://api.maik-hasler.de
      storage_public_url: https://storage.maik-hasler.de

  publish-frontend:
    name: Publish Frontend
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NAME: ${{ github.repository }}-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=staging,enable=${{ steps.version.outputs.prerelease == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite bakes VITE_* into the JS bundle at build time - these are only
          # ever used as a fallback if the runtime config (config.js, envsubst'd
          # at container start per docker-compose.yml/frontend/AGENTS.md) is
          # somehow unavailable. Without these, that fallback is the Dockerfile's
          # own ARG defaults (http://localhost:...), which is what a returning
          # user's browser would silently point at instead - see #1345.
          build-args: |
            VITE_KEYCLOAK_AUTHORITY_URL=https://login.maik-hasler.de/realms/einsatzbereit
            VITE_KEYCLOAK_CLIENT_ID=frontend
            VITE_API_URL=https://api.maik-hasler.de

  publish-keycloak:
    name: Publish Keycloak
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_NAME: ${{ github.repository }}-keycloak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Keycloak upstream version
        id: keycloak
        run: |
          KC_VERSION=$(grep -m1 'FROM quay.io/keycloak/keycloak:' keycloak/Dockerfile | sed 's/.*keycloak:\([^ ]*\).*/\1/')
          echo "upstream_version=${KC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=staging,enable=${{ steps.version.outputs.prerelease == 'true' }}
          labels: |
            org.opencontainers.image.base.version=${{ steps.keycloak.outputs.upstream_version }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: keycloak
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    name: Deploy to Staging
    needs: [publish-backend, publish-frontend, publish-keycloak]
    if: needs.publish-backend.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    # Job-level (not workflow-level), so image builds for a later tag can
    # still run concurrently with an in-progress deploy - only the actual
    # SSH/compose mutation of the shared host is serialized. Without this, two
    # RC tags pushed minutes apart (routine in this repo's release flow) can
    # both scp the same .env and both `docker compose up -d` against the same
    # host at once. Shares its group name with deploy-production below on
    # purpose - both currently deploy to the same single host (#1344), so an
    # RC deploy and a stable-release deploy landing minutes apart must also
    # serialize against each other, not just against their own kind.
    concurrency:
      group: einsatzbereit-host-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key from a secret, not ssh-keyscan's live result - a
          # DNS or BGP hijack of STAGING_SSH_HOST would otherwise have its
          # attacker-controlled host key trusted automatically, handing it
          # the deploy key and the rendered .env (Postgres, Keycloak admin,
          # MinIO credentials). See .github/AGENTS.md for how
          # STAGING_SSH_HOST_KEY was captured and verified.
          echo "${{ secrets.STAGING_SSH_HOST_KEY }}" >> ~/.ssh/known_hosts

      # Read before "Copy compose file and .env" below overwrites the host's
      # .env - this is the only point at which the previously-deployed
      # IMAGE_TAG is still readable. Without it, rollback (further down) has
      # no immutable version to name (#1733) - the images built above are
      # tagged with the exact release version (see publish-backend's Docker
      # meta step), but nothing recorded which version was actually running
      # before this deploy replaces it.
      - name: Capture previously deployed image tag
        id: previous_tag
        run: |
          set -euo pipefail
          TAG=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" bash -s <<'EOF'
            if [ -f /opt/einsatzbereit/.env ]; then
              grep -m1 '^IMAGE_TAG=' /opt/einsatzbereit/.env | cut -d'"' -f2
            fi
          EOF
          )
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "Previously deployed IMAGE_TAG: ${TAG}"
          else
            echo "No previous IMAGE_TAG found on the host (first deploy) - rollback will have nothing to revert to if this deploy fails."
          fi

      - name: Render .env
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          # Backend Keycloak client secret. Resolves the "${KEYCLOAK_BACKEND_SECRET}"
          # placeholder in keycloak/realms/einsatzbereit-realm.json ("secret") at
          # import time - see docker-compose.yml's keycloak service.
          KEYCLOAK_BACKEND_SECRET: ${{ secrets.KEYCLOAK_BACKEND_SECRET }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          # Bucket-scoped app credentials minio-init provisions the backend
          # with, instead of the root credentials above (#1353).
          MINIO_APP_ACCESS_KEY: ${{ secrets.MINIO_APP_ACCESS_KEY }}
          MINIO_APP_SECRET_KEY: ${{ secrets.MINIO_APP_SECRET_KEY }}
          # SMTP relay mailbox shared by Keycloak (KC_SMTP_*) and the backend
          # (Smtp__*) in docker-compose.yml - see #1070, #1341, #1342.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          OFFSITE_S3_ENDPOINT: ${{ secrets.OFFSITE_S3_ENDPOINT }}
          OFFSITE_S3_ACCESS_KEY: ${{ secrets.OFFSITE_S3_ACCESS_KEY }}
          OFFSITE_S3_SECRET_KEY: ${{ secrets.OFFSITE_S3_SECRET_KEY }}
          # The specific version tag this RC's images were just pushed under
          # (publish-backend's Docker meta step), not the floating "staging"
          # tag docker-compose.yml would otherwise fall back to - see #1733:
          # without this, there is no immutable artifact to roll back to,
          # since "staging" is overwritten by every deploy including the bad
          # one being rolled back from.
          IMAGE_TAG: ${{ needs.publish-backend.outputs.version }}
        run: |
          umask 077
          # Escape \, " and $ so secrets that contain quotes, hashes, leading
          # apostrophes, or a literal $ (which Compose's .env parser would
          # otherwise treat as a self-referential ${VAR} lookup, silently
          # dropping everything from the $ onward - see docker-compose.yml's
          # minio-init-script comment on the same Compose behavior) don't
          # break the parser or corrupt the value.
          escape() {
            local v="$1"
            v="${v//\\/\\\\}"
            v="${v//\$/\$\$}"
            v="${v//\"/\\\"}"
            printf '%s' "$v"
          }
          {
            printf 'POSTGRES_USER="%s"\n' "$(escape "$POSTGRES_USER")"
            printf 'POSTGRES_PASSWORD="%s"\n' "$(escape "$POSTGRES_PASSWORD")"
            printf 'KEYCLOAK_ADMIN_USER="%s"\n' "$(escape "$KEYCLOAK_ADMIN_USER")"
            printf 'KEYCLOAK_ADMIN_PASSWORD="%s"\n' "$(escape "$KEYCLOAK_ADMIN_PASSWORD")"
            printf 'KEYCLOAK_BACKEND_SECRET="%s"\n' "$(escape "$KEYCLOAK_BACKEND_SECRET")"
            printf 'MINIO_ROOT_USER="%s"\n' "$(escape "$MINIO_ROOT_USER")"
            printf 'MINIO_APP_ACCESS_KEY="%s"\n' "$(escape "$MINIO_APP_ACCESS_KEY")"
            printf 'MINIO_APP_SECRET_KEY="%s"\n' "$(escape "$MINIO_APP_SECRET_KEY")"
            printf 'MINIO_ROOT_PASSWORD="%s"\n' "$(escape "$MINIO_ROOT_PASSWORD")"
            printf 'SMTP_HOST="%s"\n' "$(escape "$SMTP_HOST")"
            printf 'SMTP_PORT="%s"\n' "$(escape "$SMTP_PORT")"
            printf 'SMTP_USERNAME="%s"\n' "$(escape "$SMTP_USERNAME")"
            printf 'SMTP_PASSWORD="%s"\n' "$(escape "$SMTP_PASSWORD")"
            printf 'SMTP_FROM_ADDRESS="%s"\n' "$(escape "$SMTP_FROM_ADDRESS")"
            printf 'SMTP_FROM_NAME="%s"\n' "$(escape "$SMTP_FROM_NAME")"
            printf 'OFFSITE_S3_ENDPOINT="%s"\n' "$(escape "$OFFSITE_S3_ENDPOINT")"
            printf 'OFFSITE_S3_ACCESS_KEY="%s"\n' "$(escape "$OFFSITE_S3_ACCESS_KEY")"
            printf 'OFFSITE_S3_SECRET_KEY="%s"\n' "$(escape "$OFFSITE_S3_SECRET_KEY")"
            printf 'IMAGE_TAG="%s"\n' "$(escape "$IMAGE_TAG")"
            # Not a secret - staging is meant to come back seeded with demo
            # organizations/opportunities on every deploy/reset (see
            # reset-staging.yml). docker-compose.yml defaults this to
            # "false" for any other deployment of the same compose file
            # (#1375).
            printf 'DATABASE_SEED_ON_STARTUP="true"\n'
          } > .env

      - name: Copy compose file and .env
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "mkdir -p /opt/einsatzbereit && chmod 700 /opt/einsatzbereit"
          scp -i ~/.ssh/id_ed25519 docker-compose.yml .env \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/opt/einsatzbereit/"

      - name: Add backend audience mapper to Keycloak (pre-deploy)
        env:
          KC_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KC_ADMIN_PASS: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          set -uo pipefail
          KC_URL="https://login.maik-hasler.de"
          KC_REALM="einsatzbereit"

          # If Keycloak is not yet running (first deploy), skip - the realm JSON
          # already contains the mapper and it will be imported on first start.
          TOKEN=$(curl -sf -X POST \
            "$KC_URL/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=admin-cli" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "username=$KC_ADMIN_USER" \
            --data-urlencode "password=$KC_ADMIN_PASS" \
            | jq -r '.access_token' 2>/dev/null) || TOKEN=""

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Keycloak not reachable or admin auth failed - skipping (fresh deploy or realm not yet present)."
            exit 0
          fi

          REALM_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM" 2>/dev/null || echo "000")
          if [ "$REALM_STATUS" != "200" ]; then
            echo "Realm '$KC_REALM' not found (HTTP $REALM_STATUS) - fresh deploy; mapper in realm JSON will be imported."
            exit 0
          fi

          FRONTEND_ID=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM/clients?clientId=frontend" \
            | jq -r '.[0].id')
          if [ -z "$FRONTEND_ID" ] || [ "$FRONTEND_ID" = "null" ]; then
            echo "::error::Could not find frontend client UUID."
            exit 1
          fi

          EXISTING=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM/clients/$FRONTEND_ID/protocol-mappers/models" \
            | jq '[.[] | select(.name == "backend-audience")] | length')
          if [ "$EXISTING" = "0" ]; then
            echo "Adding backend-audience mapper to frontend client..."
            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/clients/$FRONTEND_ID/protocol-mappers/models" \
              -d '{"name":"backend-audience","protocol":"openid-connect","protocolMapper":"oidc-audience-mapper","config":{"included.client.audience":"backend","id.token.claim":"false","access.token.claim":"true"}}'
            echo "Mapper added - new tokens will include \"backend\" in aud claim."
          else
            echo "Mapper already present - nothing to do."
          fi

      - name: Pull and restart
        id: pull_and_restart
        env:
          # Kept out of the heredoc below on purpose - a GitHub Actions
          # "${{ }}" expression is substituted into the run: text *before*
          # any shell sees it, so splicing a secret directly into a script
          # body means shell metacharacters in that secret's value would be
          # re-interpreted as script syntax instead of a literal value. An
          # intermediate env var avoids that: the value only ever flows
          # through normal shell variable expansion.
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          # Separate ssh call, with the token piped over stdin rather than
          # embedded in any command string (local or remote) - docker login
          # writes ~/.docker/config.json on the remote host, so its effect
          # persists into the next ssh session below. ${GHCR_USERNAME@Q}
          # shell-quotes the value for safe re-parsing by the remote shell.
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "docker login ghcr.io -u ${GHCR_USERNAME@Q} --password-stdin" <<< "$GHCR_TOKEN"

          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" bash -s <<'EOF'
            set -euo pipefail
            cd /opt/einsatzbereit
            chmod 600 .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune --force || true
          EOF

      - name: Capture container logs on deploy failure
        if: failure()
        run: |
          # The deploy fails inside `docker compose up` when the backend never
          # becomes healthy; the failed containers are then recreated by the
          # rollback step, losing their logs. Dump them here first so the root
          # cause (a backend startup exception / migration error) is visible in
          # the workflow log instead of an opaque "container is unhealthy".
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" bash -s <<'EOF'
            set +e
            cd /opt/einsatzbereit
            for svc in backend keycloak postgres; do
              echo "::group::docker inspect ${svc} (state)"
              docker inspect -f 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}' "${svc}" 2>&1 || true
              echo "::endgroup::"
              echo "::group::docker logs ${svc} (tail 200)"
              docker logs --tail 200 "${svc}" 2>&1 || true
              echo "::endgroup::"
            done
          EOF

      - name: Post-deploy health gate
        run: |
          set -uo pipefail
          # The API /health endpoint is a readiness probe (database + Keycloak
          # reachability), so a 200 confirms the new deployment can actually serve
          # traffic. Fail the deploy if it never becomes healthy instead of
          # reporting a green deploy over a broken stack.
          echo "Waiting for https://api.maik-hasler.de/health to report ready..."
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" https://api.maik-hasler.de/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP 200) after attempt $i."
              exit 0
            fi
            echo "Attempt $i/30: /health -> $code; retrying in 10s..."
            sleep 10
          done
          echo "::error::API did not report healthy within 5 minutes after deploy."
          exit 1

      - name: Rollback on unhealthy deploy
        # Scoped to the deploy step having actually run (not skipped because
        # an earlier step like env render/file copy/Keycloak mapper setup
        # failed first, in which case no new images were ever deployed) -
        # rather than having *succeeded*. #1733: the real failure mode this
        # step exists for is `docker compose up` itself failing because the
        # backend never reports healthy (frontend/keycloak's `depends_on:
        # condition: service_healthy` on it never resolves) - see the log
        # capture step above. That is pull_and_restart *failing*, so gating
        # on outcome == 'success' meant rollback never fired in exactly the
        # scenario it was written for.
        if: failure() && steps.pull_and_restart.conclusion != 'skipped'
        env:
          # Routed through env: rather than spliced as a raw "${{ }}"
          # expression into the script body - see "Pull and restart" above's
          # comment on GHCR_USERNAME/GHCR_TOKEN for why: a GitHub Actions
          # expression is substituted into run: text before any shell parses
          # it, so embedding one directly would let shell metacharacters in
          # its value (this one is read live off the host's .env, which
          # isn't fully under this workflow's control - e.g. an operator's
          # out-of-band incident edit) be reinterpreted as script syntax
          # instead of a literal string.
          PREV_TAG: ${{ steps.previous_tag.outputs.tag }}
        run: |
          set -uo pipefail
          if [ -z "$PREV_TAG" ]; then
            echo "::warning::No previous IMAGE_TAG was recorded (likely the first deploy to this host) - nothing to roll back to."
            exit 0
          fi
          echo "::warning::Health gate failed - rolling back to IMAGE_TAG=${PREV_TAG}."
          # PREV_TAG is passed to the remote shell as an environment variable
          # on the ssh command line (${PREV_TAG@Q} shell-quotes it for safe
          # re-parsing by the remote shell, same as GHCR_USERNAME above),
          # not substituted into the heredoc text - so the heredoc stays
          # quoted (<<'EOF') like every other remote script in this job, and
          # the value only ever flows through normal shell variable
          # expansion, never as literal script text.
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "PREV_TAG=${PREV_TAG@Q} bash -s" <<'EOF'
            set -euo pipefail
            cd /opt/einsatzbereit
            sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=\"${PREV_TAG}\"#" .env
            docker compose pull
            docker compose up -d --remove-orphans
            echo "Rollback complete - redeployed IMAGE_TAG=${PREV_TAG}."
          EOF

      - name: Bind single-step Keycloak browser flow
        env:
          KC_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KC_ADMIN_PASS: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          KC_URL="https://login.maik-hasler.de"
          KC_REALM="einsatzbereit"

          TOKEN=$(curl -sf -X POST \
            "$KC_URL/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=admin-cli" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "username=$KC_ADMIN_USER" \
            --data-urlencode "password=$KC_ADMIN_PASS" \
            | jq -r '.access_token')
          [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ] && { echo "::error::Keycloak admin auth failed"; exit 1; }
          echo "Admin token acquired."

          # Keycloak 26 with organizationsEnabled overrides browserFlow after
          # every import, so this always re-binds it below regardless of
          # whether the flow already existed.
          FLOW_COUNT=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM/authentication/flows" \
            | jq '[.[] | select(.alias == "einsatzbereit browser")] | length')

          if [ "$FLOW_COUNT" = "0" ]; then
            echo "Creating einsatzbereit browser flow..."

            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows" \
              -d '{"alias":"einsatzbereit browser","providerId":"basic-flow","topLevel":true,"builtIn":false}'

            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions/execution" \
              -d '{"provider":"auth-cookie"}'
            COOKIE_EXEC=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              | jq '.[] | select(.providerId == "auth-cookie")')
            curl -sf -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              -d "$(echo "$COOKIE_EXEC" | jq '.requirement = "ALTERNATIVE"')"

            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions/flow" \
              -d '{"alias":"einsatzbereit browser forms","type":"basic-flow","description":"Username+password form"}'
            SUBFLOW_EXEC=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              | jq '.[] | select(.authenticationFlow == true and .displayName == "einsatzbereit browser forms")')
            curl -sf -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              -d "$(echo "$SUBFLOW_EXEC" | jq '.requirement = "ALTERNATIVE"')"

            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser%20forms/executions/execution" \
              -d '{"provider":"auth-username-password-form"}'
            FORM_EXEC=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser%20forms/executions" \
              | jq '.[] | select(.providerId == "auth-username-password-form")')
            curl -sf -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser%20forms/executions" \
              -d "$(echo "$FORM_EXEC" | jq '.requirement = "REQUIRED"')"

            echo "Flow created."
          else
            echo "Flow already exists."
          fi

          REALM=$(curl -sf -H "Authorization: Bearer $TOKEN" "$KC_URL/admin/realms/$KC_REALM")
          curl -sf -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "$KC_URL/admin/realms/$KC_REALM" \
            -d "$(echo "$REALM" | jq '.browserFlow = "einsatzbereit browser"')"

          echo "browserFlow bound to 'einsatzbereit browser'."

  # Stable (non-RC) tags previously published images and stopped - nothing
  # ever deployed them (#1344). This job closes that gap. It is a separate
  # job/GitHub Environment from deploy-staging above, not a tweaked condition
  # on that job, so that once a genuinely separate production host exists,
  # switching to it is only a matter of pointing the "production" Environment's
  # secrets at the new box - no workflow restructuring. Today there is only
  # one live host (see AGENTS.md/README.md - it is staging/demo infrastructure,
  # not a hardened production box), so this deploys to the exact same host and
  # /opt/einsatzbereit directory as deploy-staging: a stable release simply
  # replaces whatever RC was previously running there with the `latest`-tagged
  # images. That is why the concurrency group above is shared between the two
  # jobs, and why IMAGE_TAG (see docker-compose.yml) is the only meaningful
  # difference in what gets deployed.
  deploy-production:
    name: Deploy to Production
    needs: [publish-backend, publish-frontend, publish-keycloak]
    if: needs.publish-backend.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: einsatzbereit-host-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key from a secret, not ssh-keyscan's live result - see
          # the matching step in deploy-staging above and .github/AGENTS.md
          # for how STAGING_SSH_HOST_KEY was captured; PRODUCTION_SSH_HOST_KEY
          # follows the same recipe (today, against the same host).
          echo "${{ secrets.PRODUCTION_SSH_HOST_KEY }}" >> ~/.ssh/known_hosts

      # See the matching step in deploy-staging above for why this has to run
      # before "Copy compose file and .env" overwrites the host's .env, and
      # why it exists at all (#1733).
      - name: Capture previously deployed image tag
        id: previous_tag
        run: |
          set -euo pipefail
          TAG=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" bash -s <<'EOF'
            if [ -f /opt/einsatzbereit/.env ]; then
              grep -m1 '^IMAGE_TAG=' /opt/einsatzbereit/.env | cut -d'"' -f2
            fi
          EOF
          )
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "Previously deployed IMAGE_TAG: ${TAG}"
          else
            echo "No previous IMAGE_TAG found on the host (first deploy) - rollback will have nothing to revert to if this deploy fails."
          fi

      - name: Render .env
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_BACKEND_SECRET: ${{ secrets.KEYCLOAK_BACKEND_SECRET }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_APP_ACCESS_KEY: ${{ secrets.MINIO_APP_ACCESS_KEY }}
          MINIO_APP_SECRET_KEY: ${{ secrets.MINIO_APP_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          # See the matching secrets in deploy-staging above.
          OFFSITE_S3_ENDPOINT: ${{ secrets.OFFSITE_S3_ENDPOINT }}
          OFFSITE_S3_ACCESS_KEY: ${{ secrets.OFFSITE_S3_ACCESS_KEY }}
          OFFSITE_S3_SECRET_KEY: ${{ secrets.OFFSITE_S3_SECRET_KEY }}
          IMAGE_TAG: ${{ needs.publish-backend.outputs.version }}
        run: |
          umask 077
          # Escape \, " and $ - see deploy-staging's "Render .env" step for
          # why $ needs escaping too (Compose's .env self-interpolation).
          escape() {
            local v="$1"
            v="${v//\\/\\\\}"
            v="${v//\$/\$\$}"
            v="${v//\"/\\\"}"
            printf '%s' "$v"
          }
          {
            printf 'POSTGRES_USER="%s"\n' "$(escape "$POSTGRES_USER")"
            printf 'POSTGRES_PASSWORD="%s"\n' "$(escape "$POSTGRES_PASSWORD")"
            printf 'KEYCLOAK_ADMIN_USER="%s"\n' "$(escape "$KEYCLOAK_ADMIN_USER")"
            printf 'KEYCLOAK_ADMIN_PASSWORD="%s"\n' "$(escape "$KEYCLOAK_ADMIN_PASSWORD")"
            printf 'KEYCLOAK_BACKEND_SECRET="%s"\n' "$(escape "$KEYCLOAK_BACKEND_SECRET")"
            printf 'MINIO_ROOT_USER="%s"\n' "$(escape "$MINIO_ROOT_USER")"
            printf 'MINIO_APP_ACCESS_KEY="%s"\n' "$(escape "$MINIO_APP_ACCESS_KEY")"
            printf 'MINIO_APP_SECRET_KEY="%s"\n' "$(escape "$MINIO_APP_SECRET_KEY")"
            printf 'MINIO_ROOT_PASSWORD="%s"\n' "$(escape "$MINIO_ROOT_PASSWORD")"
            printf 'SMTP_HOST="%s"\n' "$(escape "$SMTP_HOST")"
            printf 'SMTP_PORT="%s"\n' "$(escape "$SMTP_PORT")"
            printf 'SMTP_USERNAME="%s"\n' "$(escape "$SMTP_USERNAME")"
            printf 'SMTP_PASSWORD="%s"\n' "$(escape "$SMTP_PASSWORD")"
            printf 'SMTP_FROM_ADDRESS="%s"\n' "$(escape "$SMTP_FROM_ADDRESS")"
            printf 'SMTP_FROM_NAME="%s"\n' "$(escape "$SMTP_FROM_NAME")"
            printf 'OFFSITE_S3_ENDPOINT="%s"\n' "$(escape "$OFFSITE_S3_ENDPOINT")"
            printf 'OFFSITE_S3_ACCESS_KEY="%s"\n' "$(escape "$OFFSITE_S3_ACCESS_KEY")"
            printf 'OFFSITE_S3_SECRET_KEY="%s"\n' "$(escape "$OFFSITE_S3_SECRET_KEY")"
            # The specific version tag this release's images were just pushed
            # under (publish-backend's Docker meta step also tags this same
            # image `latest` in the registry, for anyone pulling it manually),
            # not the floating `latest` tag docker-compose.yml would otherwise
            # fall back to - see #1733: without this, there is no immutable
            # artifact to roll back to, since `latest` is overwritten by every
            # deploy including the bad one being rolled back from.
            printf 'IMAGE_TAG="%s"\n' "$(escape "$IMAGE_TAG")"
            printf 'ASPNETCORE_ENVIRONMENT="Production"\n'
            # Deliberately no DATABASE_SEED_ON_STARTUP override here - unlike
            # deploy-staging, a stable release should not reseed demo data
            # over real users' data. docker-compose.yml already defaults this
            # to "false" (#1375).
          } > .env

      - name: Copy compose file and .env
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" \
            "mkdir -p /opt/einsatzbereit && chmod 700 /opt/einsatzbereit"
          scp -i ~/.ssh/id_ed25519 docker-compose.yml .env \
            "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}:/opt/einsatzbereit/"

      - name: Add backend audience mapper to Keycloak (pre-deploy)
        env:
          KC_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KC_ADMIN_PASS: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          set -uo pipefail
          KC_URL="https://login.maik-hasler.de"
          KC_REALM="einsatzbereit"

          TOKEN=$(curl -sf -X POST \
            "$KC_URL/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=admin-cli" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "username=$KC_ADMIN_USER" \
            --data-urlencode "password=$KC_ADMIN_PASS" \
            | jq -r '.access_token' 2>/dev/null) || TOKEN=""

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Keycloak not reachable or admin auth failed - skipping (fresh deploy or realm not yet present)."
            exit 0
          fi

          REALM_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM" 2>/dev/null || echo "000")
          if [ "$REALM_STATUS" != "200" ]; then
            echo "Realm '$KC_REALM' not found (HTTP $REALM_STATUS) - fresh deploy; mapper in realm JSON will be imported."
            exit 0
          fi

          FRONTEND_ID=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM/clients?clientId=frontend" \
            | jq -r '.[0].id')
          if [ -z "$FRONTEND_ID" ] || [ "$FRONTEND_ID" = "null" ]; then
            echo "::error::Could not find frontend client UUID."
            exit 1
          fi

          EXISTING=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM/clients/$FRONTEND_ID/protocol-mappers/models" \
            | jq '[.[] | select(.name == "backend-audience")] | length')
          if [ "$EXISTING" = "0" ]; then
            echo "Adding backend-audience mapper to frontend client..."
            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/clients/$FRONTEND_ID/protocol-mappers/models" \
              -d '{"name":"backend-audience","protocol":"openid-connect","protocolMapper":"oidc-audience-mapper","config":{"included.client.audience":"backend","id.token.claim":"false","access.token.claim":"true"}}'
            echo "Mapper added - new tokens will include \"backend\" in aud claim."
          else
            echo "Mapper already present - nothing to do."
          fi

      - name: Pull and restart
        id: pull_and_restart
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" \
            "docker login ghcr.io -u ${GHCR_USERNAME@Q} --password-stdin" <<< "$GHCR_TOKEN"

          ssh -i ~/.ssh/id_ed25519 "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" bash -s <<'EOF'
            set -euo pipefail
            cd /opt/einsatzbereit
            chmod 600 .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune --force || true
          EOF

      - name: Capture container logs on deploy failure
        if: failure()
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" bash -s <<'EOF'
            set +e
            cd /opt/einsatzbereit
            for svc in backend keycloak postgres; do
              echo "::group::docker inspect ${svc} (state)"
              docker inspect -f 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}' "${svc}" 2>&1 || true
              echo "::endgroup::"
              echo "::group::docker logs ${svc} (tail 200)"
              docker logs --tail 200 "${svc}" 2>&1 || true
              echo "::endgroup::"
            done
          EOF

      - name: Post-deploy health gate
        run: |
          set -uo pipefail
          echo "Waiting for https://api.maik-hasler.de/health to report ready..."
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" https://api.maik-hasler.de/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP 200) after attempt $i."
              exit 0
            fi
            echo "Attempt $i/30: /health -> $code; retrying in 10s..."
            sleep 10
          done
          echo "::error::API did not report healthy within 5 minutes after deploy."
          exit 1

      - name: Rollback on unhealthy deploy
        # See the matching condition in deploy-staging above for why this
        # checks conclusion != 'skipped' rather than outcome == 'success'
        # (#1733).
        if: failure() && steps.pull_and_restart.conclusion != 'skipped'
        env:
          # See deploy-staging's matching rollback step above for why this is
          # routed through env: rather than spliced directly into the script.
          PREV_TAG: ${{ steps.previous_tag.outputs.tag }}
        run: |
          set -uo pipefail
          if [ -z "$PREV_TAG" ]; then
            echo "::warning::No previous IMAGE_TAG was recorded (likely the first deploy to this host) - nothing to roll back to."
            exit 0
          fi
          echo "::warning::Health gate failed - rolling back to IMAGE_TAG=${PREV_TAG}."
          # See deploy-staging's matching rollback step above for why
          # PREV_TAG is passed as a remote environment variable instead of
          # substituted into the heredoc text.
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" \
            "PREV_TAG=${PREV_TAG@Q} bash -s" <<'EOF'
            set -euo pipefail
            cd /opt/einsatzbereit
            sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=\"${PREV_TAG}\"#" .env
            docker compose pull
            docker compose up -d --remove-orphans
            echo "Rollback complete - redeployed IMAGE_TAG=${PREV_TAG}."
          EOF

      - name: Bind single-step Keycloak browser flow
        env:
          KC_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KC_ADMIN_PASS: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          KC_URL="https://login.maik-hasler.de"
          KC_REALM="einsatzbereit"

          TOKEN=$(curl -sf -X POST \
            "$KC_URL/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=admin-cli" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "username=$KC_ADMIN_USER" \
            --data-urlencode "password=$KC_ADMIN_PASS" \
            | jq -r '.access_token')
          [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ] && { echo "::error::Keycloak admin auth failed"; exit 1; }
          echo "Admin token acquired."

          FLOW_COUNT=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM/authentication/flows" \
            | jq '[.[] | select(.alias == "einsatzbereit browser")] | length')

          if [ "$FLOW_COUNT" = "0" ]; then
            echo "Creating einsatzbereit browser flow..."

            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows" \
              -d '{"alias":"einsatzbereit browser","providerId":"basic-flow","topLevel":true,"builtIn":false}'

            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions/execution" \
              -d '{"provider":"auth-cookie"}'
            COOKIE_EXEC=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              | jq '.[] | select(.providerId == "auth-cookie")')
            curl -sf -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              -d "$(echo "$COOKIE_EXEC" | jq '.requirement = "ALTERNATIVE"')"

            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions/flow" \
              -d '{"alias":"einsatzbereit browser forms","type":"basic-flow","description":"Username+password form"}'
            SUBFLOW_EXEC=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              | jq '.[] | select(.authenticationFlow == true and .displayName == "einsatzbereit browser forms")')
            curl -sf -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              -d "$(echo "$SUBFLOW_EXEC" | jq '.requirement = "ALTERNATIVE"')"

            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser%20forms/executions/execution" \
              -d '{"provider":"auth-username-password-form"}'
            FORM_EXEC=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser%20forms/executions" \
              | jq '.[] | select(.providerId == "auth-username-password-form")')
            curl -sf -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser%20forms/executions" \
              -d "$(echo "$FORM_EXEC" | jq '.requirement = "REQUIRED"')"

            echo "Flow created."
          else
            echo "Flow already exists."
          fi

          REALM=$(curl -sf -H "Authorization: Bearer $TOKEN" "$KC_URL/admin/realms/$KC_REALM")
          curl -sf -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "$KC_URL/admin/realms/$KC_REALM" \
            -d "$(echo "$REALM" | jq '.browserFlow = "einsatzbereit browser"')"

          echo "browserFlow bound to 'einsatzbereit browser'."

  github-release:
    name: GitHub Release
    # Depends on the three publish-* jobs directly (not deploy-staging, which
    # only runs for -rc.N tags) so a GitHub Release is created for stable
    # tags too, and only after the images they describe actually published.
    needs: [publish-backend, publish-frontend, publish-keycloak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags needed to find the previous tag and diff
          # commit messages against it below.
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Groups commit subjects since the previous tag by Conventional Commit
      # type (enforced PR-title-side by pr-title.yml, so main's history is
      # squash-merged commits in that format already) instead of relying on
      # GitHub's own auto-generated notes, which group by PR label - a label
      # this repo's PRs don't consistently set.
      - name: Generate release notes from Conventional Commits
        id: notes
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"

          # Previous tag = the one immediately before this one in semver
          # order across both stable and rc tags - not the previous tag
          # chronologically, since an rc for an already-released line could
          # in principle be re-cut later.
          PREV_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --list 'v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*' --sort=-v:refname \
            | grep -A1 -x -F "$CURRENT_TAG" | tail -n1)
          if [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            PREV_TAG=""
          fi

          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="$PREV_TAG..$CURRENT_TAG"
          fi

          {
            echo "## What's Changed"
            echo

            breaking=$(git log "$RANGE" --pretty=format:'%s' | grep -E '^[a-z]+(\(.+\))?!:' || true)
            if [ -n "$breaking" ]; then
              echo "### Breaking Changes"
              echo "$breaking" | sed 's/^/- /'
              echo
            fi

            declare -A LABELS=( [feat]="Features" [fix]="Bug Fixes" [perf]="Performance" [refactor]="Refactoring" [docs]="Documentation" [revert]="Reverts" )
            for type in feat fix perf refactor docs revert; do
              commits=$(git log "$RANGE" --pretty=format:'%s' | grep -E "^${type}(\(.+\))?!?:" || true)
              if [ -n "$commits" ]; then
                echo "### ${LABELS[$type]}"
                echo "$commits" | sed 's/^/- /'
                echo
              fi
            done

            if [ -z "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${CURRENT_TAG}"
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          FLAGS=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          # Idempotent: a re-run of this job (e.g. after an unrelated failure
          # elsewhere in the workflow, retried via "Re-run failed jobs") would
          # otherwise fail with "release already exists" - edit notes in place
          # instead, mirroring the tag-idempotency check in release-rc.yml.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists - updating notes instead."
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file release-notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
          fi
