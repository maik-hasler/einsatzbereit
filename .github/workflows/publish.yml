name: Publish

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # Single restore+build for the whole solution, shared by the three test
  # jobs below via upload-artifact/download-artifact instead of each of them
  # redoing it - see the matching job in dotnet.yml for the full rationale.
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Building the whole solution here compiles tests/VisualTests.csproj,
      # which downloads Chrome for Testing + Chrome Headless Shell (~290 MiB
      # combined) from cdn.playwright.dev via its InstallPlaywrightBrowsers
      # MSBuild target. Caching this means that download only happens when
      # the pinned TUnit.Playwright version changes, not on every RC cut.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}

      - name: Restore backend
        working-directory: backend
        run: dotnet restore

      - name: Build backend
        working-directory: backend
        run: dotnet build --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-build
          path: |
            backend/**/bin/**
            backend/**/obj/**
          # See the matching step in dotnet.yml - tests/VisualTests's
          # Playwright driver lives under a dot-prefixed bin/.../.playwright/
          # folder that upload-artifact excludes by default.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  backend-fast-tests:
    name: Backend Fast Tests
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      # See the matching step in dotnet.yml - artifact zip/unzip drops the
      # Unix executable bit on the native apphost binaries `dotnet run`
      # launches directly.
      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - name: Test - Application.UnitTests
        working-directory: backend
        run: dotnet run --project tests/Application.UnitTests --no-restore --no-build

      - name: Test - ArchitectureTests
        working-directory: backend
        run: dotnet run --project tests/ArchitectureTests --no-restore --no-build

  backend-integration-tests:
    name: Backend Integration Tests
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      # See the matching step in dotnet.yml - artifact zip/unzip drops the
      # Unix executable bit on the native apphost binaries `dotnet run`
      # launches directly.
      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.0
          docker pull ghcr.io/axllent/mailpit:latest
          docker pull quay.io/minio/minio:latest

      - name: Test - IntegrationTests (Aspire + Docker)
        working-directory: backend
        run: dotnet run --project tests/IntegrationTests --no-restore --no-build

  backend-visual-tests:
    name: Backend Visual Tests
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      # See the matching step in dotnet.yml - artifact zip/unzip drops the
      # Unix executable bit on the native apphost binaries `dotnet run`
      # launches directly.
      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # See the matching step in dotnet.yml's visual-tests job for why this
      # cache exists, and this job's backend-build job for why it needs
      # restoring again here (a different runner from the one that populated
      # it - needs: backend-build guarantees this lands after that save).
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.0
          docker pull ghcr.io/axllent/mailpit:latest
          docker pull quay.io/minio/minio:latest

      - name: Test - VisualTests (Aspire + Docker + Playwright)
        working-directory: backend
        run: dotnet run --project tests/VisualTests --no-restore --no-build

  publish-backend:
    name: Publish Backend
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NAME: ${{ github.repository }}-backend
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=staging,enable=${{ steps.version.outputs.prerelease == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/src/Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-frontend:
    name: Publish Frontend
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NAME: ${{ github.repository }}-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type check
        working-directory: frontend
        run: pnpm check

      - name: Unit tests
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Log in to Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=staging,enable=${{ steps.version.outputs.prerelease == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-keycloak:
    name: Publish Keycloak
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_NAME: ${{ github.repository }}-keycloak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Keycloak upstream version
        id: keycloak
        run: |
          KC_VERSION=$(grep -m1 'FROM quay.io/keycloak/keycloak:' keycloak/Dockerfile | sed 's/.*keycloak:\([^ ]*\).*/\1/')
          echo "upstream_version=${KC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=staging,enable=${{ steps.version.outputs.prerelease == 'true' }}
          labels: |
            org.opencontainers.image.base.version=${{ steps.keycloak.outputs.upstream_version }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: keycloak
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    name: Deploy to Staging
    needs: [publish-backend, publish-frontend, publish-keycloak]
    if: needs.publish-backend.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Render .env
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          # Backend Keycloak client secret. Resolves the "${KEYCLOAK_BACKEND_SECRET}"
          # placeholder in keycloak/realms/einsatzbereit-realm.json ("secret") at
          # import time - see docker-compose.yml's keycloak service.
          KEYCLOAK_BACKEND_SECRET: ${{ secrets.KEYCLOAK_BACKEND_SECRET }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          # SMTP relay mailbox shared by Keycloak (KC_SMTP_*) and the backend
          # (Smtp__*) in docker-compose.yml - see #1070, #1341, #1342.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          # Where Alertmanager sends alert emails (docker-compose.yml's
          # alertmanager-config, #1081) - not a mailbox credential, just the
          # recipient address, but still per-environment so it isn't a
          # committed literal.
          ALERT_NOTIFICATION_EMAIL: ${{ secrets.ALERT_NOTIFICATION_EMAIL }}
        run: |
          umask 077
          # Wrap each value in double quotes and escape \ and " so secrets that
          # contain quotes, hashes, leading apostrophes or other compose .env
          # metacharacters do not break the parser.
          escape() {
            local v="$1"
            v="${v//\\/\\\\}"
            v="${v//\"/\\\"}"
            printf '%s' "$v"
          }
          {
            printf 'POSTGRES_USER="%s"\n' "$(escape "$POSTGRES_USER")"
            printf 'POSTGRES_PASSWORD="%s"\n' "$(escape "$POSTGRES_PASSWORD")"
            printf 'KEYCLOAK_ADMIN_USER="%s"\n' "$(escape "$KEYCLOAK_ADMIN_USER")"
            printf 'KEYCLOAK_ADMIN_PASSWORD="%s"\n' "$(escape "$KEYCLOAK_ADMIN_PASSWORD")"
            printf 'KEYCLOAK_BACKEND_SECRET="%s"\n' "$(escape "$KEYCLOAK_BACKEND_SECRET")"
            printf 'MINIO_ROOT_USER="%s"\n' "$(escape "$MINIO_ROOT_USER")"
            printf 'MINIO_ROOT_PASSWORD="%s"\n' "$(escape "$MINIO_ROOT_PASSWORD")"
            printf 'SMTP_HOST="%s"\n' "$(escape "$SMTP_HOST")"
            printf 'SMTP_PORT="%s"\n' "$(escape "$SMTP_PORT")"
            printf 'SMTP_USERNAME="%s"\n' "$(escape "$SMTP_USERNAME")"
            printf 'SMTP_PASSWORD="%s"\n' "$(escape "$SMTP_PASSWORD")"
            printf 'SMTP_FROM_ADDRESS="%s"\n' "$(escape "$SMTP_FROM_ADDRESS")"
            printf 'SMTP_FROM_NAME="%s"\n' "$(escape "$SMTP_FROM_NAME")"
            printf 'GRAFANA_ADMIN_USER="%s"\n' "$(escape "$GRAFANA_ADMIN_USER")"
            printf 'GRAFANA_ADMIN_PASSWORD="%s"\n' "$(escape "$GRAFANA_ADMIN_PASSWORD")"
            printf 'ALERT_NOTIFICATION_EMAIL="%s"\n' "$(escape "$ALERT_NOTIFICATION_EMAIL")"
            # Not a secret - staging is meant to come back seeded with demo
            # organizations/opportunities on every deploy/reset (see
            # reset-staging.yml). docker-compose.yml defaults this to
            # "false" for any other deployment of the same compose file
            # (#1375).
            printf 'DATABASE_SEED_ON_STARTUP="true"\n'
          } > .env

      - name: Copy compose file and .env
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "mkdir -p /opt/einsatzbereit && chmod 700 /opt/einsatzbereit"
          scp -i ~/.ssh/id_ed25519 docker-compose.yml .env \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/opt/einsatzbereit/"

      - name: Add backend audience mapper to Keycloak (pre-deploy)
        env:
          KC_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KC_ADMIN_PASS: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          set -uo pipefail
          KC_URL="https://login.maik-hasler.de"
          KC_REALM="einsatzbereit"

          # Attempt to get admin token from the currently-running Keycloak.
          # If Keycloak is not yet running (first deploy), skip - the realm JSON
          # already contains the mapper and it will be imported on first start.
          TOKEN=$(curl -sf -X POST \
            "$KC_URL/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=admin-cli" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "username=$KC_ADMIN_USER" \
            --data-urlencode "password=$KC_ADMIN_PASS" \
            | jq -r '.access_token' 2>/dev/null) || TOKEN=""

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Keycloak not reachable or admin auth failed - skipping (fresh deploy or realm not yet present)."
            exit 0
          fi

          # Verify the realm exists.
          REALM_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM" 2>/dev/null || echo "000")
          if [ "$REALM_STATUS" != "200" ]; then
            echo "Realm '$KC_REALM' not found (HTTP $REALM_STATUS) - fresh deploy; mapper in realm JSON will be imported."
            exit 0
          fi

          # Get frontend client UUID.
          FRONTEND_ID=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM/clients?clientId=frontend" \
            | jq -r '.[0].id')
          if [ -z "$FRONTEND_ID" ] || [ "$FRONTEND_ID" = "null" ]; then
            echo "::error::Could not find frontend client UUID."
            exit 1
          fi

          # Add mapper only if not already present (idempotent).
          EXISTING=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM/clients/$FRONTEND_ID/protocol-mappers/models" \
            | jq '[.[] | select(.name == "backend-audience")] | length')
          if [ "$EXISTING" = "0" ]; then
            echo "Adding backend-audience mapper to frontend client..."
            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/clients/$FRONTEND_ID/protocol-mappers/models" \
              -d '{"name":"backend-audience","protocol":"openid-connect","protocolMapper":"oidc-audience-mapper","config":{"included.client.audience":"backend","id.token.claim":"false","access.token.claim":"true"}}'
            echo "Mapper added - new tokens will include \"backend\" in aud claim."
          else
            echo "Mapper already present - nothing to do."
          fi

      - name: Pull and restart
        id: pull_and_restart
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" bash -s <<'EOF'
            set -euo pipefail
            cd /opt/einsatzbereit
            chmod 600 .env
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            # Tag running images as staging-previous so we can roll back if the
            # health gate fails after the deploy.
            for svc in backend frontend keycloak; do
              img="ghcr.io/maik-hasler/einsatzbereit-${svc}"
              docker tag "${img}:staging" "${img}:staging-previous" 2>/dev/null || true
            done
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune --force || true
          EOF

      - name: Capture container logs on deploy failure
        if: failure()
        run: |
          # The deploy fails inside `docker compose up` when the backend never
          # becomes healthy; the failed containers are then recreated by the
          # rollback step, losing their logs. Dump them here first so the root
          # cause (a backend startup exception / migration error) is visible in
          # the workflow log instead of an opaque "container is unhealthy".
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" bash -s <<'EOF'
            set +e
            cd /opt/einsatzbereit
            for svc in backend keycloak postgres prometheus alertmanager node-exporter grafana loki alloy; do
              echo "::group::docker inspect ${svc} (state)"
              docker inspect -f 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}' "${svc}" 2>&1 || true
              echo "::endgroup::"
              echo "::group::docker logs ${svc} (tail 200)"
              docker logs --tail 200 "${svc}" 2>&1 || true
              echo "::endgroup::"
            done
          EOF

      - name: Post-deploy health gate
        run: |
          set -uo pipefail
          # The API /health endpoint is a readiness probe (database + Keycloak
          # reachability), so a 200 confirms the new deployment can actually serve
          # traffic. Fail the deploy if it never becomes healthy instead of
          # reporting a green deploy over a broken stack.
          echo "Waiting for https://api.maik-hasler.de/health to report ready..."
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" https://api.maik-hasler.de/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP 200) after attempt $i."
              exit 0
            fi
            echo "Attempt $i/30: /health -> $code; retrying in 10s..."
            sleep 10
          done
          echo "::error::API did not report healthy within 5 minutes after deploy."
          exit 1

      - name: Rollback on unhealthy deploy
        # Scoped to the actual deploy step so an earlier failure (env render,
        # file copy, Keycloak mapper setup) - where no new images were ever
        # deployed - doesn't re-tag staging-previous over a healthy stack.
        if: failure() && steps.pull_and_restart.outcome == 'success'
        run: |
          echo "::warning::Health gate failed - rolling back to staging-previous images."
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" bash -s <<'EOF'
            set -euo pipefail
            cd /opt/einsatzbereit
            # Re-tag staging-previous back to staging so compose uses the old images.
            for svc in backend frontend keycloak; do
              img="ghcr.io/maik-hasler/einsatzbereit-${svc}"
              if docker image inspect "${img}:staging-previous" &>/dev/null; then
                docker tag "${img}:staging-previous" "${img}:staging"
              fi
            done
            docker compose up -d --remove-orphans
            echo "Rollback complete - previous images re-deployed."
          EOF

      - name: Bind single-step Keycloak browser flow
        env:
          KC_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KC_ADMIN_PASS: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          KC_URL="https://login.maik-hasler.de"
          KC_REALM="einsatzbereit"

          # Get admin token from master realm
          TOKEN=$(curl -sf -X POST \
            "$KC_URL/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=admin-cli" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "username=$KC_ADMIN_USER" \
            --data-urlencode "password=$KC_ADMIN_PASS" \
            | jq -r '.access_token')
          [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ] && { echo "::error::Keycloak admin auth failed"; exit 1; }
          echo "Admin token acquired."

          # Ensure the single-step flow exists; create it if missing (e.g. first deploy
          # or realm wipe). Keycloak 26 with organizationsEnabled overrides browserFlow
          # after every import, so we always re-bind it at the end regardless.
          FLOW_COUNT=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "$KC_URL/admin/realms/$KC_REALM/authentication/flows" \
            | jq '[.[] | select(.alias == "einsatzbereit browser")] | length')

          if [ "$FLOW_COUNT" = "0" ]; then
            echo "Creating einsatzbereit browser flow..."

            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows" \
              -d '{"alias":"einsatzbereit browser","providerId":"basic-flow","topLevel":true,"builtIn":false}'

            # Add auth-cookie (set to ALTERNATIVE)
            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions/execution" \
              -d '{"provider":"auth-cookie"}'
            COOKIE_EXEC=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              | jq '.[] | select(.providerId == "auth-cookie")')
            curl -sf -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              -d "$(echo "$COOKIE_EXEC" | jq '.requirement = "ALTERNATIVE"')"

            # Add sub-flow for the form (set to ALTERNATIVE)
            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions/flow" \
              -d '{"alias":"einsatzbereit browser forms","type":"basic-flow","description":"Username+password form"}'
            SUBFLOW_EXEC=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              | jq '.[] | select(.authenticationFlow == true and .displayName == "einsatzbereit browser forms")')
            curl -sf -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser/executions" \
              -d "$(echo "$SUBFLOW_EXEC" | jq '.requirement = "ALTERNATIVE"')"

            # Add auth-username-password-form to sub-flow (set to REQUIRED)
            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser%20forms/executions/execution" \
              -d '{"provider":"auth-username-password-form"}'
            FORM_EXEC=$(curl -sf \
              -H "Authorization: Bearer $TOKEN" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser%20forms/executions" \
              | jq '.[] | select(.providerId == "auth-username-password-form")')
            curl -sf -X PUT \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$KC_URL/admin/realms/$KC_REALM/authentication/flows/einsatzbereit%20browser%20forms/executions" \
              -d "$(echo "$FORM_EXEC" | jq '.requirement = "REQUIRED"')"

            echo "Flow created."
          else
            echo "Flow already exists."
          fi

          # Always re-bind - Keycloak organizations override this after every import
          REALM=$(curl -sf -H "Authorization: Bearer $TOKEN" "$KC_URL/admin/realms/$KC_REALM")
          curl -sf -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "$KC_URL/admin/realms/$KC_REALM" \
            -d "$(echo "$REALM" | jq '.browserFlow = "einsatzbereit browser"')"

          echo "browserFlow bound to 'einsatzbereit browser'."
