name: Dependency Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'backend/Directory.Packages.props'
      - 'backend/**/*.csproj'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nuget-audit:
    name: NuGet dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Restore backend
        working-directory: backend
        run: dotnet restore

      - name: Audit NuGet packages
        working-directory: backend
        # set -o pipefail: without it, `dotnet list package | tee ...`
        # reports the exit code of `tee` (always 0), not `dotnet list
        # package` - a restore failure or NuGet feed outage would otherwise
        # produce an error string that the old grep-based check found no
        # "critical"/"high" in, and pass. --format json + jq replaces the
        # substring grep (which a package literally named e.g. "*High*"
        # would false-positive on) with a structured field check; jq empty
        # fails closed if the output isn't valid JSON at all.
        run: |
          set -euo pipefail

          dotnet list package --vulnerable --include-transitive --format json > nuget-audit.json

          if ! jq empty nuget-audit.json; then
            echo "::error::dotnet list package produced output that is not valid JSON - failing closed."
            cat nuget-audit.json
            exit 1
          fi

          findings=$(jq -r '
            .projects[]?
            | .path as $path
            | (.frameworks[]? // {})
            | ((.topLevelPackages // []) + (.transitivePackages // []))[]
            | .id as $id
            | .vulnerabilities[]?
            | select(.severity | test("high|critical"; "i"))
            | "\($path): \($id) - \(.severity) (\(.advisoryurl // "no advisory url"))"
          ' nuget-audit.json)

          if [ -n "$findings" ]; then
            echo "::error::Critical or high NuGet vulnerabilities found:"
            echo "$findings"
            exit 1
          fi
          echo "No critical or high vulnerabilities found."

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Audit npm packages
        working-directory: frontend
        run: pnpm audit --audit-level=high
