name: Dependency Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget-audit:
    name: NuGet dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Restore backend
        working-directory: backend
        run: dotnet restore

      - name: Audit NuGet packages
        working-directory: backend
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/nuget-audit.txt
          if grep -qi "critical\|high" /tmp/nuget-audit.txt; then
            echo "Critical or high vulnerabilities found:"
            grep -i "critical\|high" /tmp/nuget-audit.txt
            exit 1
          fi
          echo "No critical or high vulnerabilities found."

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Audit npm packages
        working-directory: frontend
        run: pnpm audit --audit-level=high
