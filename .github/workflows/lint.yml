name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ban-typographic-dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ban em/en dashes (U+2014, U+2013)
        run: |
          if grep -rPnI '[\x{2013}\x{2014}]' .; then
            echo "::error::Em/en dashes found - use plain ASCII hyphens (-) instead"
            exit 1
          fi

  ban-unescaped-keycloak-apostrophes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ban unescaped apostrophes in Keycloak English messages
        run: |
          FILE=keycloak/themes/einsatzbereit/login/messages/messages_en.properties
          if grep -nE '^[^#[:space:]].*=' "$FILE" | grep -P "(?<!')'(?!')"; then
            echo "::error::Unescaped apostrophe in $FILE - MessageFormat silently drops it. Escape literal apostrophes as '' (see #1854)."
            exit 1
          fi

  editorconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check EditorConfig conformance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes editorconfig-checker@6.1.1 -config .editorconfig-checker.json
