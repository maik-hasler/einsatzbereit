name: Build and Test Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'keycloak/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'keycloak/**'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore backend
        working-directory: backend
        run: dotnet restore

      - name: Verify formatting
        working-directory: backend
        run: dotnet format --verify-no-changes --no-restore

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: pnpm/action-setup@v6.0.9
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Restore backend
        working-directory: backend
        run: dotnet restore

      - name: Build backend
        working-directory: backend
        run: dotnet build --no-restore

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.6.1
          docker pull ghcr.io/axllent/mailpit:latest
          docker pull quay.io/minio/minio:latest

      - name: Test - Application.UnitTests
        working-directory: backend
        run: dotnet run --project tests/Application.UnitTests --no-build

      - name: Test - ArchitectureTests
        working-directory: backend
        run: dotnet run --project tests/ArchitectureTests --no-build

      - name: Test - IntegrationTests (Aspire + Docker)
        working-directory: backend
        run: dotnet run --project tests/IntegrationTests --no-build

      - name: Test - VisualTests (Aspire + Docker + Playwright)
        working-directory: backend
        run: dotnet run --project tests/VisualTests --no-build
