name: Build and Test Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'keycloak/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'keycloak/**'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      - name: Verify formatting
        working-directory: backend
        run: dotnet format --verify-no-changes --no-restore

  # Single restore+build for the whole solution, shared by format-check/
  # fast-tests/integration-tests/visual-tests below via upload-artifact/
  # download-artifact instead of each of those four jobs redoing it.
  # format-check only strictly needs a restore (no build output), but
  # depends on this anyway to keep the whole workflow down to one restore -
  # at the cost of format-check's own signal landing later than it would
  # standalone, now behind this job's setup+build time.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # VisualTests.csproj's InstallPlaywrightBrowsers target (below, via
      # `dotnet build`) shells out to `playwright install --with-deps
      # chromium`, which runs its own `apt-get update`/`install` on every
      # Playwright-cache miss. apt has no default network timeout, so a
      # stalled connection to the runner's mirror hangs silently instead of
      # failing - observed burning this job's entire timeout with zero
      # output partway through `apt-get update` (einsatzbereit#2139-2138
      # CI). Retries + a bounded per-request timeout turn that hang into a
      # fast retry/failure instead.
      - name: Harden apt against CI mirror stalls
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/80-retries

          # Acquire::http::Timeout only aborts a connection that goes fully
          # silent - it doesn't catch one that's merely glacial. Observed a
          # `.deb` package trickle in at ~8 KB/s from azure.archive.ubuntu.com
          # (one runner-images mirrorlist entry, /etc/apt/apt-mirrors.txt)
          # for 7+ minutes before the next package stalled outright, burning
          # the whole job timeout without ever going idle long enough to
          # retry (einsatzbereit#2139 CI). Drop that entry from the
          # mirrorlist so apt only ever considers the direct, historically
          # reliable archive - a plain substring swap, safe even if the
          # file's exact format changes upstream.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi

      # Reproduced locally: a concurrent `apt-get install` (this repo's own
      # sandbox ran several `dotnet build` invocations in parallel) fails
      # this same Playwright `--with-deps` install immediately with "E:
      # Could not get lock /var/lib/dpkg/lock-frontend" instead of hanging -
      # a different symptom from the mirror stall above, but the same
      # command is exposed to it. GitHub-hosted runners run apt-daily.timer/
      # apt-daily-upgrade.timer shortly after boot, which can hold this same
      # lock for a few minutes; waiting it out here is cheap insurance
      # against that immediate failure mode landing on this step instead.
      - name: Wait for background apt/dpkg locks to clear
        run: |
          for i in $(seq 1 60); do
            if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
              echo "apt/dpkg lock held (attempt $i/60) - waiting..."
              sleep 5
            else
              exit 0
            fi
          done
          echo "::warning::apt/dpkg lock still held after 5 minutes - proceeding anyway"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Building the whole solution here compiles tests/VisualTests.csproj,
      # which downloads Chrome for Testing + Chrome Headless Shell (~290 MiB
      # combined) from cdn.playwright.dev via its InstallPlaywrightBrowsers
      # MSBuild target. Caching this means that download only happens when
      # the pinned TUnit.Playwright version changes, not on every run.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}

      - name: Restore backend
        working-directory: backend
        run: dotnet restore

      - name: Build backend
        working-directory: backend
        run: dotnet build --no-restore

      # NSwag (Api.csproj's Debug-only MSBuild target) just regenerated these
      # three files into the working tree above. All three are committed, so
      # a PR that changes a DTO or route and forgets to commit the
      # regenerated client would otherwise pass every check here - the
      # frontend type-checks against the stale client and only breaks at
      # runtime against the new API.
      - name: Verify generated API client and OpenAPI doc are committed
        run: |
          if ! git diff --exit-code -- \
            backend/src/Api/wwwroot/openapi-v1.json \
            frontend/src/client/api-client.ts \
            backend/tests/IntegrationTests/ApiClient.cs
          then
            echo "::error::Generated NSwag client/OpenAPI doc is out of date - run 'dotnet build' in backend/ (Debug configuration) and commit the result."
            exit 1
          fi

      - name: Check for pending EF Core model changes
        working-directory: backend
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          dotnet ef migrations has-pending-model-changes -p src/Infrastructure -s src/Api --no-build

      # visual-tests actually launches a browser on its own runner (a
      # different machine from this job), so it needs its own Playwright
      # browser cache restore below - this artifact only carries the .NET
      # build output (bin/obj), not ~/.cache/ms-playwright.
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-build
          path: |
            backend/**/bin/**
            backend/**/obj/**
          # tests/VisualTests's Playwright driver lives under a dot-prefixed
          # bin/.../.playwright/ folder (upload-artifact excludes dotfiles by
          # default), which silently dropped it from the artifact on the
          # first real run of this shape and failed visual-tests with
          # "Driver not found" - no test build output here is actually
          # sensitive, so including hidden files is safe.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  fast-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      # Restoring (not re-running `dotnet restore`) the same NuGet cache key
      # the build job just populated - --no-restore/--no-build still need the
      # actual package contents on disk (analyzers/build targets they
      # contribute get imported during MSBuild evaluation), not just the
      # bin/obj output below.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      # actions/upload-artifact/download-artifact zip the artifact and don't
      # preserve the Unix executable bit, so the native apphost binaries
      # (bin/.../<ProjectName>, no file extension - what `dotnet run`
      # actually launches) come back non-executable and fail with
      # "Permission denied" otherwise.
      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      # TUnit's Microsoft.Testing.Platform runner ships coverage support out of the
      # box (Microsoft.Testing.Extensions.CodeCoverage arrives transitively via
      # TUnit itself - no extra PackageReference needed in any test project) - a
      # fixed --coverage-output name keeps the path below predictable instead of
      # the tool's default GUID-named file.
      - name: Test - Application.UnitTests
        working-directory: backend
        run: dotnet run --project tests/Application.UnitTests --no-restore --no-build --coverage --coverage-output-format cobertura --coverage-output application-unittests.cobertura.xml

      - name: Test - ArchitectureTests
        working-directory: backend
        run: dotnet run --project tests/ArchitectureTests --no-restore --no-build --coverage --coverage-output-format cobertura --coverage-output architecturetests.cobertura.xml

      # Report-only (einsatzbereit#1327): no threshold gate, so a low or
      # dropping number never blocks a merge - visibility is the point.
      # Written straight to the job's own step summary rather than via a
      # third-party action, to avoid per-class noise and a dependency on a
      # Node 20 runtime GitHub Actions is deprecating.
      - name: Publish coverage summary
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: |
          {
            echo "### Code coverage"
            echo
            echo "| Project | Lines | Branches |"
            echo "| --- | --- | --- |"
            for entry in \
              "application-unittests.cobertura.xml:Application.UnitTests" \
              "architecturetests.cobertura.xml:ArchitectureTests"
            do
              filename="${entry%%:*}"
              label="${entry##*:}"
              report=$(find . -path "*/TestResults/$filename" -print -quit)
              if [ -z "$report" ]; then
                echo "| $label | _missing_ | _missing_ |"
                continue
              fi
              line_rate=$(sed -n 's/.*line-rate="\([0-9.]*\)".*/\1/p' "$report" | head -1)
              branch_rate=$(sed -n 's/.*branch-rate="\([0-9.]*\)".*/\1/p' "$report" | head -1)
              line_pct=$(awk -v r="$line_rate" 'BEGIN { printf "%.0f%%", r * 100 }')
              branch_pct=$(awk -v r="$branch_rate" 'BEGIN { printf "%.0f%%", r * 100 }')
              echo "| $label | $line_pct | $branch_pct |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      # actions/upload-artifact/download-artifact zip the artifact and don't
      # preserve the Unix executable bit, so the native apphost binaries
      # (bin/.../<ProjectName>, no file extension - what `dotnet run`
      # actually launches) come back non-executable and fail with
      # "Permission denied" otherwise.
      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.1
          docker pull ghcr.io/axllent/mailpit:latest
          docker pull quay.io/minio/minio:latest

      - name: Test - IntegrationTests (Aspire + Docker)
        working-directory: backend
        run: dotnet run --project tests/IntegrationTests --no-restore --no-build

  visual-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      # actions/upload-artifact/download-artifact zip the artifact and don't
      # preserve the Unix executable bit, so the native apphost binaries
      # (bin/.../<ProjectName>, no file extension - what `dotnet run`
      # actually launches) come back non-executable and fail with
      # "Permission denied" otherwise.
      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      # Restores the same Playwright browser cache the build job just
      # populated - the build job's download happened on that job's own
      # runner, a different machine from this one, so the browser binary
      # itself (~/.cache/ms-playwright, not part of the artifact above) has
      # to be fetched again here. `needs: build` guarantees this restore
      # lands after that job's cache save, so this is a guaranteed hit rather
      # than a fresh download.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.1
          docker pull ghcr.io/axllent/mailpit:latest
          docker pull quay.io/minio/minio:latest

      - name: Test - VisualTests (Aspire + Docker + Playwright)
        working-directory: backend
        run: dotnet run --project tests/VisualTests --no-restore --no-build

      # VisualTestBase only keeps a trace for tests that actually failed (see
      # TeardownTracingAsync) - upload whatever landed so a flake can be
      # inspected (playwright.dev/dotnet/docs/trace-viewer) instead of
      # re-guessed from a bare assertion message.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: backend/tests/VisualTests/bin/**/trace-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
