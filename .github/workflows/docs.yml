name: Build and Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get revision info
        id: revision
        run: |
          echo "revnumber=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "revremark=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          echo "revdate=$(date +%d.%m.%Y)" >> "$GITHUB_OUTPUT"

      # revremark in particular comes from a commit subject an outside
      # contributor controls (the PR title, on a squash-merge push to main).
      # Passing it through env: instead of splicing "${{ }}" into the
      # program text below means a backtick or "$( )" in that text is just
      # an env var value, never re-parsed as shell syntax.
      - name: Build AsciiDoc
        uses: tonynv/asciidoctor-action@755dc03a42aee715c3705fc31d2ca106b7ee90fd # v2
        env:
          REVNUMBER: ${{ steps.revision.outputs.revnumber }}
          REVDATE: ${{ steps.revision.outputs.revdate }}
          REVREMARK: ${{ steps.revision.outputs.revremark }}
        with:
          program: |
            asciidoctor \
              -r asciidoctor-diagram \
              -a imagesdir=images \
              -a revnumber="$REVNUMBER" \
              -a revdate="$REVDATE" \
              -a revremark="$REVREMARK" \
              -b html5 \
              -D build \
              docs/Architecture/Architecture.adoc
            cp -r docs/Architecture/images/. build/images/
            asciidoctor \
              -b html5 \
              -D build/ADRs \
              docs/ADRs/*.adoc
            asciidoctor \
              -b html5 \
              -D build/TDRs \
              docs/TDRs/*.adoc

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
