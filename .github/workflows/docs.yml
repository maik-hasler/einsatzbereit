name: Build and Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # See dotnet.yml's `changes`/`required` jobs for why this workflow no longer
  # filters its triggers by `paths:` (#2204) - GitHub can't resolve a required
  # status check for a workflow a paths filter skipped outright.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'docs/**'
              - '.github/workflows/docs.yml'

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get revision info
        id: revision
        run: |
          echo "revnumber=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "revremark=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          echo "revdate=$(date +%d.%m.%Y)" >> "$GITHUB_OUTPUT"

      - name: Build AsciiDoc
        uses: tonynv/asciidoctor-action@755dc03a42aee715c3705fc31d2ca106b7ee90fd # v2
        env:
          REVNUMBER: ${{ steps.revision.outputs.revnumber }}
          REVDATE: ${{ steps.revision.outputs.revdate }}
          REVREMARK: ${{ steps.revision.outputs.revremark }}
        with:
          program: |
            asciidoctor \
              -r asciidoctor-diagram \
              -a imagesdir=images \
              -a revnumber="$REVNUMBER" \
              -a revdate="$REVDATE" \
              -a revremark="$REVREMARK" \
              -b html5 \
              -D build \
              docs/Architecture/Architecture.adoc
            cp -r docs/Architecture/images/. build/images/
            asciidoctor \
              -b html5 \
              -D build/ADRs \
              docs/ADRs/*.adoc
            asciidoctor \
              -b html5 \
              -D build/TDRs \
              docs/TDRs/*.adoc

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # The always-running required status check - see dotnet.yml's `required` job.
  # Deliberately excludes `deploy`: that job only ever runs on push (never on a PR,
  # per its own `if:`), so it has nothing to say about whether a PR can merge.
  required:
    name: Required
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
